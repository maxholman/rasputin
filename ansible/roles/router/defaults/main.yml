# ---------------------------------------------------------------------------
# The declared truth for this router. Everything else is generated from here.
#
# Hardware invariants (NOT configurable - they are physical facts):
#   wlan0  built-in brcmfmac  always a wifi CLIENT (cannot AP reliably)
#   wlan1  USB MT7921 dongle  always the AP
#   eth0                      either DHCP server (mode=lan) or client (mode=wan)
# ---------------------------------------------------------------------------
wan_wifi_if: wlan0
ap_if: wlan1
eth_if: eth0

# wlan1 AP - constant in both modes.
ap_ssid: pineapple2
ap_channel: 36
ap_country: TW
ap_subnet: 10.9.141
ap_dhcp_start: 50
ap_dhcp_end: 254

# eth0 when it is serving (mode=lan only).
eth_subnet: 10.6.141
eth_dhcp_start: 50
eth_dhcp_end: 200

# Clients are pushed THIS box as their only resolver - see the dnsmasq AP/LAN
# snippets. There is deliberately no secondary: a public fallback would be a
# standing bypass around the blocklist, the DoH upstream and the kill switch.

default_mode: serve

# Admin plane. SSH is permitted only on interfaces acting as LAN in the current
# mode. Setting this true also exposes SSH on the uplink - i.e. to the hotel.
admin_on_uplink: false

# Whether deploying should immediately apply the network mode + firewall.
# Set false for the first run on a box you cannot physically reach.
converge_on_deploy: true

# One failing unit costs this box most of its boot. NetworkManager-wait-online
# waits 60s for a managed connection that never comes - NM holds only lo and
# eth0 here, and eth0 it did not bring up - then fails. network-online.target
# sits behind it, dnsmasq sits behind that, and rasputin's converge blocks on
# `systemctl restart dnsmasq`, so the whole boot waits out the timeout: no DHCP
# and no DNS for the house for the first minute after a reboot.
#
# Safe to remove rather than reorder because dnsmasq is already bind-dynamic,
# so it copes with its addresses arriving after it starts.
disable_nm_wait_online: true

# The apt sources, declared. Upgrading is NOT done by this role - a converge
# that silently upgraded the box would be a converge you could not predict -
# but which mirrors it would upgrade FROM is configuration, and belongs here.
manage_apt_sources: true
debian_suite: trixie

# Who administers this box. The SD card image's own account was never declared
# anywhere - the role simply assumed whatever it connected as - so this declares
# the account instead of inheriting one.
admin_user: max

# append: true, so this adds to whatever primary group the account has rather
# than replacing it. sudo is the one that matters; the rest are the hardware
# groups the image gave pi, kept so the new account can reach the same devices.
admin_groups: [sudo, adm, dialout, video, plugdev, input, netdev, spi, i2c, gpio]

# SSH. Key auth is already how every path into this box works, so the password
# path is a second way in that nothing depends on. It matters more than it looks
# because sshd binds 0.0.0.0 and the input chain is the ONLY thing keeping :22
# off the venue - and `rasputin rollback-fire` deletes that table wholesale.
harden_ssh: true

# Exactly who may log in. The file is written WHOLE, not appended to: an
# authorized_keys that nothing declares is how a deploy key issued for another
# project held root on this box for months, and no run would ever have noticed.
# Public material, so it belongs in the repo rather than the vault.
#
# One key per origin - person plus machine - never per destination. The point is
# being able to revoke one laptop without touching anyone else, and the comment
# field is the only label this file has, so make it say whose and from where.
#
# Add before you remove, and prove the new key on a connection that is not
# multiplexed (ssh -o ControlPath=none) - ControlMaster will happily reuse an
# authenticated socket and tell you a key works when it has never been offered.
admin_ssh_keys:
  # Max's workstation, and currently the only way in. Passphrase-protected,
  # which costs nothing: nothing on the box schedules a converge, so every run
  # is already someone at a terminal typing a become password anyway.
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILXEmtGE22ssdQJgHMyoE3yMxQ5ttm7+Han/BOYRU4nu mholman@ws7"

# Privacy on venue networks. Randomises wlan0's MAC per-ESS and eth0's MAC when
# eth0 is the uplink. Turn off only if some network you rely on does MAC-based
# auth or hands you a MAC reservation you need.
randomize_client_mac: true

# The AP's own BSSID, randomised at boot before hostapd claims the interface.
# A fixed BSSID beside a randomised client MAC is worse than randomising
# neither: it identifies this box at every venue AND ties the changing client
# address to it, which is the correlation the client randomisation is buying.
randomize_ap_mac: true

# How long to wait at boot for the USB AP dongle to enumerate before giving up
# on renaming it. Boot reaches hostapd before the device exists on this
# hardware, which is why the wait is needed at all.
ap_device_timeout: 20

# ---------------------------------------------------------------------------
# Venue profiles. One word sets WAN leg + VPN state + DNS upstream together,
# because setting them independently at midnight in a hotel is how you get it
# wrong. mode=serve means eth0 FEEDS a downstream network; mode=uplink means
# eth0 CONSUMES the venue's.
# ---------------------------------------------------------------------------
#
# randomize_mac is per profile because a fresh identity is only worth its cost
# where the network is someone else's. Home is our own phone: it recognises
# nobody, logs nothing, and hands a new MAC a new lease - often on a new subnet
# - which renumbers the uplink on every converge and every boot for no gain.
# Omitted, it follows randomize_client_mac.
rasputin_profiles:
  home: { mode: serve, vpn: false, randomize_mac: false } # 5G hotspot upstream, no tunnel
  hotel-wifi: { mode: serve, vpn: true, randomize_mac: true } # venue wifi upstream, tunnel + killswitch
  hotel-eth: { mode: uplink, vpn: true, randomize_mac: true } # venue ethernet upstream, tunnel + killswitch

vpn_interface: wg0

# How long to wait for wlan0 to take an address after a MAC change. 20s was
# not always enough mid-session, and 45s was not enough at cold boot (scan +
# SAE + DHCP on brcmfmac): the boot converge burned the whole window and
# skipped the venue-lateral rules.
wifi_reassociate_timeout: 90

blocky_user: blocky

# ---------------------------------------------------------------------------
# Resolver. Blocky owns :53 and dnsmasq is demoted to DHCP-only.
#
# Chosen over AdGuard Home because it does not rewrite its own config at
# runtime and ships no web UI - on a box that goes to conferences, an admin
# password is a liability and a config the daemon edits behind Ansible's back
# is the RaspAP failure mode with a nicer logo.
# ---------------------------------------------------------------------------
blocky_version: v0.34.0
blocky_sha256: 1a07aa52b127d75d15584706c76843b9fa3706be133b0d7b96b2ca65ba4f561f

# Every upstream here filters known-malicious domains at the resolver, which is
# a second opinion on the denylist below rather than a duplicate of it. That
# uniformity is what blocky_upstream_strategy depends on: 1.1.1.1 was the
# fallback and does NO filtering, so racing it could have answered for a domain
# Quad9 refuses. 1.1.1.2/1.0.0.2 are Cloudflare's malware-blocking pair and do.
#
# Quad9 is given by HOSTNAME because its certificate has no IP SANs - see
# blocky_bootstrap. The Cloudflare pair is given by IP, which their certificate
# supports: CN=security.cloudflare-dns.com carries IP SANs for both.
blocky_upstreams:
  - https://dns.quad9.net/dns-query
  - https://1.1.1.2/dns-query
  - https://1.0.0.2/dns-query

# strict asks the first upstream and only falls to the next when it fails, so a
# lossy uplink pays blocky_upstream_timeout in full before anything else is
# tried - and a client that gives up at 5s never sees the second answer. Racing
# two of them costs one extra query and removes that cliff. Safe only while
# every member of the group filters; see the note above before adding one.
blocky_upstream_strategy: parallel_best

# Bootstraps the hostname above. Must be an IP-addressed DoH endpoint or we
# would need a plaintext query to get started; the Cloudflare certificate
# carries IP SANs for exactly this.
blocky_bootstrap: https://1.1.1.2/dns-query
blocky_upstream_timeout: 3s

# Security only. Ads and trackers are handled on-device; adult and gambling
# categories are deliberately NOT blocked. This list is malware, phishing,
# ransomware, scam and cryptojacking domains - roughly 360k of them.
blocky_denylists:
  threat:
    - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.medium-onlydomains.txt

# Cache. Every uncached answer costs a full round trip over whatever uplink we
# are on - measured at ~130 ms on a 5G tether - and AP clients pay it directly,
# because unlike the UniFi (which has its own cache) this box is their only
# resolver and has nothing in front of it.
#
# maxTime was the expensive setting: at 30m it CAPPED authoritative TTLs,
# discarding day-long records every half hour to no purpose. minTime is the
# opposite lever - it floors short TTLs - and stays modest on purpose, because
# short CDN TTLs are how you get steered off a dead edge.
#
# Long cache times are safe on a box that travels: every converge restarts
# blocky, and changing venue means converging, so nothing survives the move.
blocky_cache_min: 10m
blocky_cache_max: 12h

# A failed lookup must not stick. blocky's default of 30m means one query made
# while the tunnel was down poisons that name for the next half hour.
blocky_cache_negative: 1m

# Two hits is enough to call a name popular on a network this small; the stock
# threshold of 5 means most names expire before they ever qualify.
blocky_prefetch_threshold: 2
blocky_prefetch_expires: 12h

blocky_block_ttl: 6h
blocky_list_refresh: 24h
blocky_log_level: info

# DoH listener. blocky_doh_cert/key are NOT set here - they are set by the
# role only once the material is actually present on the controller, because a
# blocky pointed at a certificate that does not exist fails to start, and this
# box has no second resolver to fall back on.
#
# Generated offline by bin/make-doh-cert.sh --new-root. A dedicated anchor,
# deliberately not chained to any wider estate or employer CA: this box is
# carried into hostile networks and should vouch for nothing but itself.
# The root and intermediate KEYS stay here and never reach the router.
blocky_doh_local_dir: ~/.rasputin-pki
blocky_doh_dir: /etc/blocky/tls
blocky_doh_port: 443

# The router's own traffic. With the tunnel up, nothing may leave except via
# wg0 and the WireGuard handshake itself - otherwise the resolver's DoH query
# escapes out the venue's uplink the moment wg0 dies, which is the one leak
# the client-side kill switch cannot see. The tunnel needs neither DNS nor a
# correct clock (the peer is a literal IP), so this has no bootstrap deadlock.
killswitch_restrict_output: true

# ---------------------------------------------------------------------------
# Captive portals. `rasputin portal` opens a bounded hole - tunnel down, clients
# limited to :80/:443, DNS plaintext to the venue's own resolver - for long
# enough to complete a login page, then converges back to the declared profile
# on its own. The window is the only thing standing between a hotel lobby and
# an unprotected router, so it is short by default.
# ---------------------------------------------------------------------------
portal_timeout: 900

# Addresses, not names: the probe has to work with DNS already broken. See
# portal_probe() in rasputin for why. Both are Cloudflare anycast for the same
# service, so they answer from whichever continent you are on - add your own if
# a venue blackholes them, keeping to endpoints that return 204.
portal_probe_targets:
  - { ip: 162.159.36.5, host: cp.cloudflare.com, path: /generate_204 }
  - { ip: 162.159.46.5, host: cp.cloudflare.com, path: /generate_204 }
