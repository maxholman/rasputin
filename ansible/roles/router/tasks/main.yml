---
# No update_cache: this box's own DNS is fail-closed (099-upstream.conf points
# at a Proton resolver inside a WireGuard tunnel that isn't up), so apt cannot
# resolve deb.debian.org and a refresh fails hard. With state=present and the
# packages already installed, no network is needed at all. Re-enable the cache
# refresh only once the Pi can resolve names.
- name: Install router packages
  ansible.builtin.apt:
    name: [dnsmasq, hostapd, dhcpcd5, nftables]
    state: present

# --- RaspAP-ectomy (opt-in: -e purge_raspap=true) --------------------------
# Only the web UI/daemon removal is opt-in; the config fragments above are not.
- name: Stop and disable RaspAP services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [raspapd, lighttpd]
  failed_when: false
  when: purge_raspap | default(false) | bool

# NOT optional. These cannot coexist with ours - verified with dnsmasq --test:
# 090_raspap.conf and 10-base.conf both set log-facility, which dnsmasq rejects
# as "illegal repeated keyword", and 090_wlan1.conf duplicates our wlan1
# dhcp-range. Leaving them in place means dnsmasq refuses to start at all.
# 090_adblock.conf and 099-upstream.conf are left alone; they don't conflict.
- name: Remove conflicting RaspAP dnsmasq fragments
  ansible.builtin.file:
    path: "/etc/dnsmasq.d/{{ item }}"
    state: absent
  loop:
    - 090_raspap.conf
    - 090_wlan0.conf   # should never have existed: wlan0 is always a client
    - 090_wlan1.conf
    - 090_eth0.conf
  notify: restart dnsmasq

# --- config ----------------------------------------------------------------
- name: Create netmode directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /usr/local/share/netmode
    - /etc/netmode

# default_mode is only a SEED (written once, force:false). The authoritative
# mode lives in /etc/netmode/mode and diverges the moment you run `netmode
# uplink`. Gating config on the seed meant a routine deploy at a hotel could
# install a DHCP server on the VENUE's ethernet - a rogue DHCP server on
# someone else's LAN, permanent when converge_on_deploy=false.
- name: Read the declared mode
  ansible.builtin.slurp:
    src: /etc/netmode/mode
  register: _mode_file
  failed_when: false
  changed_when: false

- name: Resolve the effective mode
  ansible.builtin.set_fact:
    effective_mode: "{{ (_mode_file.content | b64decode | trim) if (_mode_file.content is defined) else default_mode }}"

- name: Show which mode config is being applied for
  ansible.builtin.debug:
    msg: "effective mode = {{ effective_mode }} (seed default_mode = {{ default_mode }})"

- name: Base dnsmasq policy
  ansible.builtin.template:
    src: 10-base.conf.j2
    dest: /etc/dnsmasq.d/10-base.conf
    mode: "0644"
  notify: restart dnsmasq

- name: AP dnsmasq config (constant)
  ansible.builtin.template:
    src: 20-wlan1-ap.conf.j2
    dest: /etc/dnsmasq.d/20-wlan1-ap.conf
    mode: "0644"
  notify: restart dnsmasq

# Staged, not installed: netmode installs/removes it per mode.
- name: Stage the eth0-LAN snippet
  ansible.builtin.template:
    src: 30-eth0-lan.conf.j2
    dest: /usr/local/share/netmode/30-eth0-lan.conf
    mode: "0644"
  notify: converge netmode

# Skipped unless ap_passphrase is vaulted. Without this guard the run aborts on
# an undefined variable - or worse, renders an empty passphrase and drops every
# client currently associated to the AP.
# Without this, a deploy with converge_on_deploy=false deletes RaspAP's
# 090_eth0.conf and installs nothing in its place, because only `netmode
# converge` installs the snippet. dnsmasq would then restart with no DHCP on
# eth0 and every downstream WAN would lose its lease. netmode still owns this
# file afterwards - it removes it when switching to uplink mode.
- name: Install the eth0-LAN snippet when serving
  ansible.builtin.template:
    src: 30-eth0-lan.conf.j2
    dest: /etc/dnsmasq.d/30-eth0-lan.conf
    mode: "0644"
  when: effective_mode == 'serve'
  notify: restart dnsmasq

# Symmetric half: if we are an uplink, the LAN snippet must be ABSENT, not
# merely skipped, or a leftover from a previous serve deploy keeps serving DHCP.
- name: Remove the eth0-LAN snippet when eth0 is an uplink
  ansible.builtin.file:
    path: /etc/dnsmasq.d/30-eth0-lan.conf
    state: absent
  when: effective_mode != 'serve'
  notify: restart dnsmasq

- name: hostapd config
  ansible.builtin.template:
    src: hostapd.conf.j2
    dest: /etc/hostapd/hostapd.conf
    mode: "0600"
  when: ap_passphrase is defined and ap_passphrase | length > 0
  notify: hostapd changed

- name: Warn if hostapd is unmanaged
  ansible.builtin.debug:
    msg: "ap_passphrase undefined - leaving /etc/hostapd/hostapd.conf alone. Vault it to manage the AP."
  when: ap_passphrase is not defined or ap_passphrase | length == 0

# netfilter-persistent restores /etc/iptables/rules.v4 at every boot, which is
# where RaspAP's blanket masquerade comes back from. NAT belongs to nftables
# now, so the nat table is emptied. Docker adds its own rules at runtime and is
# unaffected. The 192.168.50.0/24 rule referenced a subnet that does not exist.
- name: Stop netfilter-persistent restoring RaspAP's blanket NAT
  ansible.builtin.copy:
    dest: /etc/iptables/rules.v4
    mode: "0644"
    backup: true
    content: |
      # Managed by rasputin. NAT is owned by nftables (table inet netmode).
      *nat
      :PREROUTING ACCEPT [0:0]
      :INPUT ACCEPT [0:0]
      :OUTPUT ACCEPT [0:0]
      :POSTROUTING ACCEPT [0:0]
      COMMIT

# wlan0 presents a fresh MAC to each SSID, and a random one while merely
# scanning - otherwise the real MAC is broadcast before you ever associate.
- name: Randomise the wifi client MAC per network
  ansible.builtin.lineinfile:
    path: /etc/wpa_supplicant/wpa_supplicant.conf
    line: "{{ item }}"
    insertbefore: BOF
    state: "{{ 'present' if (randomize_client_mac | default(true) | bool) else 'absent' }}"
  loop:
    - mac_addr=1
    - preassoc_mac_addr=1
  notify: restart wpa_supplicant

# Stop announcing ourselves to every venue's DHCP server. `hostname` sends
# "raspberrypi"; `clientid` sends a stable identifier that survives MAC
# randomisation and defeats the point of it entirely.
- name: Do not leak hostname to venue DHCP servers
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '^hostname$'
    replace: '#hostname   # rasputin: do not announce ourselves to venues'

- name: Do not send a stable DHCP client identifier
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '^clientid$'
    replace: 'noclientid  # rasputin: a stable clientid would defeat MAC randomisation'

- name: Install netmode
  ansible.builtin.template:
    src: netmode.j2
    dest: /usr/local/sbin/netmode
    mode: "0755"
  notify: converge netmode

- name: Converge-on-boot unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/netmode-converge.service
    mode: "0644"
    content: |
      [Unit]
      Description=Converge declared network mode
      After=network-pre.target dhcpcd.service
      Wants=network-pre.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/netmode converge
      [Install]
      WantedBy=multi-user.target
  notify: reload systemd

- name: Seed the declared mode if unset
  ansible.builtin.copy:
    dest: /etc/netmode/mode
    content: "{{ default_mode }}\n"
    mode: "0644"
    force: false

- name: Enable services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    masked: false      # hostapd ships masked on Debian/RPi OS; enable errors on it
  loop: [dnsmasq, hostapd, dhcpcd, netmode-converge]
