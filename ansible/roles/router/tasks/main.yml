---
# No update_cache: this box's DNS is fail-closed by design - blocky answers only
# over a DoH upstream, and the kill switch drops that egress whenever the tunnel
# is down - so a refresh cannot resolve deb.debian.org and fails hard. With
# state=present and the packages already installed, no network is needed at all.
- name: Install router packages
  ansible.builtin.apt:
    name: [dnsmasq, hostapd, dhcpcd5, nftables]
    state: present

# --- RaspAP-ectomy ---------------------------------------------------------
# raspapd is a oneshot that runs at EVERY boot, and its job includes disabling
# systemd-networkd. Stopping it is not enough - it is masked so nothing can pull
# it back in by dependency, and so it cannot undo the networkd migration.
#
# Skipped once purge_raspap_packages has taken the unit file: masking a unit
# that is gone re-creates the mask that the purge then deletes, and the two
# tasks report changed at each other forever.
- name: Mask RaspAP daemon
  ansible.builtin.systemd:
    name: raspapd
    state: stopped
    enabled: false
    masked: true
  failed_when: false
  when: purge_raspap | bool and not (purge_raspap_packages | bool)

- name: Stop and disable the RaspAP web UI
  ansible.builtin.systemd:
    name: lighttpd
    state: stopped
    enabled: false
  failed_when: false
  when: purge_raspap | bool

# The sudoers drop-in outlives the daemon and is the real prize: it grants
# www-data passwordless root to read wpa_supplicant.conf (the venue PSKs), to
# overwrite hostapd.conf (the AP passphrase) and dhcpcd.conf (what netmode
# rewrites), and to drop new /etc/dnsmasq.d/090_*.conf fragments - re-entry
# around both the blocklist and the DoH upstream. Removing a file cannot make
# sudoers unparseable, so this needs no validate step.
- name: Remove the RaspAP sudoers drop-in
  ansible.builtin.file:
    path: /etc/sudoers.d/090_raspap
    state: absent
  when: purge_raspap | bool

# raspapd's boot job was, undocumented, the only thing starting wpa_supplicant
# on wlan0. The first reboot after masking it came up with the AP beaconing
# and a dead WAN - the whole house lost internet. The instance unit is the
# boot-time owner now; netmode's MAC-randomise/reassociate flow needs a
# running supplicant and provides nothing of its own.
- name: Link the wlan0 supplicant config for the instance unit
  ansible.builtin.file:
    src: wpa_supplicant.conf
    dest: /etc/wpa_supplicant/wpa_supplicant-wlan0.conf
    state: link

- name: Enable wpa_supplicant on the wifi WAN
  ansible.builtin.systemd:
    name: wpa_supplicant@wlan0
    enabled: true

# NOT optional. The 090_* ones cannot coexist with ours - verified with
# dnsmasq --test: 090_raspap.conf and 10-base.conf both set log-facility, which
# dnsmasq rejects as "illegal repeated keyword", and 090_wlan1.conf duplicates
# our wlan1 dhcp-range. Leaving them in place means dnsmasq refuses to start.
# The 099-upstream pair is inert only because 10-base.conf sets port=0; drop
# port=0 with those in place and dnsmasq resolves in plaintext to 1.1.1.1,
# silently bypassing blocky and the DoH upstream. They go too.
- name: Remove RaspAP dnsmasq fragments
  ansible.builtin.file:
    path: "/etc/dnsmasq.d/{{ item }}"
    state: absent
  loop:
    - 090_raspap.conf
    - 090_wlan0.conf   # should never have existed: wlan0 is always a client
    - 090_wlan1.conf
    - 090_eth0.conf
    - 090_adblock.conf
    - 099-upstream.conf
    - 099-upstream.conf.orig
  notify: restart dnsmasq

# --- the half of RaspAP that listens ----------------------------------------
# See purge_raspap_api in defaults for what these are. Masked rather than
# disabled for the same reason raspapd is: a thing that runs at boot and
# reconfigures the router must not be able to return by dependency. Nothing
# depends on them - netmode owns every knob they offer.
#
# Skipped once the unit files are gone, for the reason given at raspapd above.
- name: Mask the RaspAP REST API and its network monitor
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  failed_when: false
  loop:
    - restapi.service
    - "raspap-network-activity@{{ wan_wifi_if }}.service"
  when: purge_raspap_api | bool and not (purge_raspap_packages | bool)

# The web UI's tail. php-fpm is the FastCGI backend for the UI that is already
# disabled and it listens on a unix socket, not a port, so this is surface
# rather than exposure. It goes because a daemon running for a service that no
# longer exists is one more thing the next rebuild has to explain.
- name: Stop the web stack's leftover daemons and timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  failed_when: false
  loop:
    - php8.4-fpm.service
    - lighttpd-maint.timer
    - phpsessionclean.timer
    - openvpn.service   # the tunnel here is wireguard; this never ran
  when: purge_raspap | bool

# A SECOND set of base chains at the same hooks as inet netmode, reloaded from
# /etc/nftables.conf at every boot. The filter half is shadowed by netmode's
# drop policy - a drop at a hook beats an accept in another chain there - but
# chain routethrough carries a standing `oifname eth0 masquerade` that nothing
# sanctioned, and in uplink mode eth0 is the venue's leg. The role already
# empties the iptables equivalent below; it never knew about the nft-native one.
#
# Emptied, and deliberately NOT given a `flush ruleset`: nftables.service and
# netmode-converge have no ordering between them, so a flush here would wipe
# the live table on whichever boot it happened to run second.
- name: Stop nftables.conf restoring RaspAP's second table
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    mode: "0644"
    backup: true
    content: |
      #!/usr/sbin/nft -f
      # Managed by rasputin. The live ruleset is table inet netmode, written by
      # netmode at every converge and rebuilt at boot. Nothing else claims a
      # hook here - no flush on purpose, see the role task.
  when: purge_raspap | bool

# --- what masking left behind ------------------------------------------------
# See purge_raspap_packages. Ordered removal-last: the units are already masked
# and the daemons already stopped, so nothing here is taking a running service
# away from the box.
- name: Remove the RaspAP web stack
  ansible.builtin.apt:
    name:
      - lighttpd
      - lighttpd-mod-deflate
      - lighttpd-mod-openssl
      - php8.4-fpm
      - php8.4-cli
      - php8.4-common
      - php8.4-opcache
      - php8.4-readline
      - php-common
      - openvpn          # the tunnel here is wireguard; this never ran
      - vnstat           # RaspAP's bandwidth graphs; the status panel reads /proc/net/dev
    state: absent
    purge: true
    autoremove: true
  when: purge_raspap_packages | bool

# Globbed rather than listed: the installer leaves a dated copy of both trees
# each time it runs - three under /etc, four web roots - so the set grows and
# naming them individually goes stale. /etc/lighttpd goes too: purging the
# package takes its own conffiles, but 50-raspap-router.conf was dropped in by
# the installer, so dpkg does not know it is there.
- name: Find every RaspAP config tree and web root
  ansible.builtin.find:
    paths: "{{ item.path }}"
    patterns: "{{ item.pattern }}"
    file_type: any
    depth: 1
  loop:
    - { path: /etc, pattern: "raspap*" }
    - { path: /var/www, pattern: "htm*" }
  register: _raspap_trees
  when: purge_raspap_packages | bool

- name: Remove the RaspAP config trees and web roots
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ (_raspap_trees.results | default([]) | map(attribute='files', default=[])
        | flatten | map(attribute='path') | list) + ['/etc/lighttpd'] }}
  when: purge_raspap_packages | bool

# RaspAP installs by shell script, so apt has no record of these units or the
# binaries they run. The masks in /etc go with them - a mask pointing at a unit
# file that no longer exists is a tombstone, not a guard.
#
# routing.service is the one worth removing on its own merits. It is a disabled
# oneshot that writes /etc/nftables.conf from a heredoc - RaspAP's own AP
# masquerade, table inet ap - and then enables nftables. One systemctl enable,
# or one dependency picking it up, and it replaces the live ruleset this role
# manages. Disabled is not the same as harmless.
- name: Remove the orphaned RaspAP units and the binaries they run
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /lib/systemd/system/raspapd.service
    - /lib/systemd/system/restapi.service
    - /lib/systemd/system/raspap-network-activity@.service
    - /etc/systemd/system/raspapd.service
    - /etc/systemd/system/restapi.service
    - "/etc/systemd/system/raspap-network-activity@{{ wan_wifi_if }}.service"
    - /etc/systemd/system/routing.service
    - /usr/local/bin/raspap-network-monitor
    - /usr/local/bin/raspap-routing.sh
    # The enablement links, which nothing else removes: systemctl enable wrote
    # them, so dpkg does not own them and purging the package leaves them
    # behind. A .wants link to a unit file that is gone is not inert - boot
    # still tries to pull the unit in and fails. openvpn-client@client is here
    # for the same reason the package is: RaspAP enabled it, it never ran.
    - /etc/systemd/system/multi-user.target.wants/raspapd.service
    - /etc/systemd/system/multi-user.target.wants/restapi.service
    - "/etc/systemd/system/multi-user.target.wants/raspap-network-activity@{{ wan_wifi_if }}.service"
    - /etc/systemd/system/multi-user.target.wants/openvpn-client@client.service
    # A bridge named br0 with eth0 as its member. systemd-networkd is disabled
    # here so neither file does anything today, and br0 does not exist - but
    # enabling networkd would silently enslave the LAN leg into a bridge this
    # role does not know about. Same shape as routing.service: inert until
    # something turns its engine on.
    - /etc/systemd/network/raspap-bridge-br0.netdev
    - /etc/systemd/network/raspap-br0-member-eth0.network
  register: _raspap_units
  when: purge_raspap_packages | bool

- name: Reload systemd after removing units
  ansible.builtin.systemd:
    daemon_reload: true
  when: _raspap_units.changed | default(false)

# --- the last author of table ip nat ----------------------------------------
# See purge_iptables_persistent. The live table survives until the next boot -
# nothing here flushes it, because a flush races netmode for the ruleset. It
# goes by not being restored, which is also what proves this worked.
- name: Remove the iptables persistence layer
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - netfilter-persistent
    state: absent
    purge: true
    autoremove: true
  when: purge_iptables_persistent | bool

- name: Remove the saved iptables rules
  ansible.builtin.file:
    path: /etc/iptables
    state: absent
  when: purge_iptables_persistent | bool

# --- the minute the boot spends waiting -------------------------------------
# See disable_nm_wait_online. Masked rather than disabled: network-online.target
# Wants it, so disabling alone leaves it one dependency away from coming back,
# and a Wants on a masked unit is skipped rather than fatal.
- name: Stop NetworkManager-wait-online holding up the boot
  ansible.builtin.systemd:
    name: NetworkManager-wait-online.service
    state: stopped
    enabled: false
    masked: true
  failed_when: false
  when: disable_nm_wait_online | bool

# --- back to basics ----------------------------------------------------------
# See strip_to_basics. Everything here arrived with the SD card image and none
# of it has a job on a router. avahi is deliberately NOT in the list: netmode
# references it six times, silencing it per-interface, so removing it would
# break the converge.
- name: Remove what the image brought and this router does not use
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - docker-ce-rootless-extras
      - docker-buildx-plugin
      - docker-compose-plugin
      - docker-model-plugin
      - containerd.io
      - locales-all      # 231MB of locales on a headless box
      - cloud-init       # five units and a boot delay, on a box this role declares whole
      - bluez
      - modemmanager     # the uplink is wifi to a hotspot; there is no modem
      - udisks2
      - pcscd            # smartcard daemon
      - build-essential  # no dkms here, so nothing compiles anything
    state: absent
    purge: true
    autoremove: true
  when: strip_to_basics | bool

# Queried rather than listed: these package names carry the kernel version, so
# a hardcoded list goes stale on the next kernel upgrade - and one is queued.
- name: Find the installed kernel build trees
  ansible.builtin.shell:
    cmd: dpkg-query -W -f='${Package}\n' 'linux-headers-*' 'linux-kbuild-*' 2>/dev/null || true
  register: _kbuild
  changed_when: false
  when: strip_to_basics | bool

- name: Remove the kernel build trees
  ansible.builtin.apt:
    name: "{{ _kbuild.stdout_lines }}"
    state: absent
    purge: true
    autoremove: true
  when: strip_to_basics | bool and (_kbuild.stdout_lines | default([]) | length > 0)

- name: Remove the Docker apt source and what cloud-init left
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/keyrings/docker.asc
    - /var/lib/cloud
    - /etc/cloud
    # The masks below outlive the units they masked - same tombstone problem as
    # the RaspAP ones. Nothing removes them but this.
    - /etc/systemd/system/docker.service
    - /etc/systemd/system/docker.socket
    - /etc/systemd/system/containerd.service
  register: _strip_files
  when: strip_to_basics | bool

- name: Reload systemd after the strip
  ansible.builtin.systemd:
    daemon_reload: true
  when: _strip_files.changed | default(false)

# --- mce888 ------------------------------------------------------------------
# Removed rather than stopped: the image is kept on the controller, so nothing
# here is the last copy. The named volume is left alone - see purge_mce888.
- name: Check whether Docker can still be talked to
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: _docker_sock
  when: purge_mce888 | bool

# Gated on the socket because the Mask Docker task below takes it away: on every
# run after the first, docker cannot connect, the removal fails, failed_when
# swallows it and changed_when reports success anyway. Skipping says what is
# true - there is no daemon to remove anything from - and the task still does
# its job on a box that has not been converged yet.
- name: Remove the mce888 container and image
  ansible.builtin.command: "docker {{ item }}"
  loop:
    - rm --force mce888-sms
    - image rm --force mce888-sms:latest
  register: _mce888_rm
  failed_when: false
  changed_when: _mce888_rm.rc == 0
  when: purge_mce888 | bool and (_docker_sock.stat.exists | default(false))

# Masked, not merely stopped. Docker installs its own base chains and a bridge
# at every start, and those chains are the one part of this box's packet path
# that netmode does not write - so leaving it able to start leaves a second
# author of the ruleset.
- name: Mask Docker
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  failed_when: false
  loop: [docker.service, docker.socket, containerd.service]
  when: purge_mce888 | bool and not (strip_to_basics | bool)

# The mce888 deploy key carried no from= or command= restriction on an account
# with passwordless sudo, so a key minted to ship a container in another project
# held full root here. It goes by not being listed, rather than by being matched
# and deleted - which is the difference between a file that is audited and a
# file that is patched.
#
# The assert is the lockout guard: a typo that renders admin_ssh_keys empty
# would otherwise write an empty file and take the next connection with it.
- name: Refuse to write an empty authorized_keys
  ansible.builtin.assert:
    that:
      - admin_ssh_keys | length > 0
      - admin_ssh_keys | select('match', '^(ssh|ecdsa)-') | list | length == admin_ssh_keys | length
    fail_msg: "admin_ssh_keys is empty or malformed - refusing to write authorized_keys"
    quiet: true

# --- the admin account ------------------------------------------------------
# See admin_user. pi came with the SD card image and was never declared here,
# which is why nothing creates it. This declares its replacement instead.
#
# The password is copied from the outgoing account rather than set from a
# variable, so Max's existing password keeps working and no secret has to live
# in the vault. Seeded on creation only - update_password: on_create means
# changing it on the box afterwards sticks. Once the old account is gone this
# whole seeding step no-ops, and a rebuild from bare metal needs the password
# set by hand once.
- name: Read the outgoing account's password hash
  ansible.builtin.getent:
    database: shadow
    key: "{{ legacy_admin_user }}"
  no_log: true
  failed_when: false
  when: admin_user != legacy_admin_user

- name: Create the admin account
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: "{{ admin_groups }}"
    append: true
    shell: /bin/bash
    create_home: true
    password: "{{ (ansible_facts.getent_shadow | default({}))[legacy_admin_user][0] | default(omit) }}"
    update_password: on_create
  no_log: true

- name: Give the admin account an ssh directory
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    mode: "0700"

# Looped, not joined: Ansible leaves the \n in join('\n') as two literal
# characters, so every key past the first lands on a line sshd cannot parse.
- name: Declare who may log in
  ansible.builtin.copy:
    dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
    owner: "{{ admin_user }}"
    mode: "0600"
    backup: true
    content: |
      # Managed by rasputin - declared in admin_ssh_keys. Edits here are lost.
      {% for key in admin_ssh_keys %}
      {{ key }}
      {% endfor %}

# Came with the SD card image: `max ALL=(ALL) NOPASSWD: ALL` for an account
# that did not exist on this box. Dormant only while nobody creates that user -
# which is exactly what this role now does. The filename is a lie as well; it
# is called 010_pi-nopasswd and grants pi nothing.
- name: Remove the image's stray root grant
  ansible.builtin.file:
    path: /etc/sudoers.d/010_pi-nopasswd
    state: absent

# The one step in this role that cannot be walked back from the controller:
# after it, the only way in is admin_user's key. Hence two gates - the flag,
# turned on only once that login and its sudo have been proved by hand, and the
# refusal to delete whichever account this run is connected as.
- name: Remove the account the image shipped with
  ansible.builtin.user:
    name: "{{ legacy_admin_user }}"
    state: absent
    remove: true
    force: true
  when:
    - remove_legacy_admin | bool
    - admin_user != legacy_admin_user
    - ansible_user != legacy_admin_user

- name: Remove the mce888 environment file
  ansible.builtin.file:
    path: "/home/{{ legacy_admin_user }}/mce888-sms.env"
    state: absent
  when: purge_mce888 | bool

# --- secrets the old stack left readable -------------------------------------
# RaspAP-era ownership: the wireguard configs are www-data-owned and 0644, so
# the tunnel's private key is readable by every account on the box. They are
# also the one thing this role cannot rebuild from the repo - the key exists
# nowhere else - which makes these permissions the only thing standing over an
# identity a dead SD card would take with it.
- name: Find the wireguard configs
  ansible.builtin.find:
    paths: "/etc/wireguard"
    patterns: "*"          # not just *.conf - wg0.conf.bak holds a key too
    file_type: file        # wg0.conf is a symlink; its target is matched anyway
  register: _wg_confs

- name: Lock the wireguard configs to root
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ _wg_confs.files }}"
  loop_control:
    label: "{{ item.path }}"

# Old copies from when wlan0 was tried as the AP. Both are 0644 and both carry a
# wpa_passphrase line, so they leak the passphrase that the live hostapd.conf is
# careful to keep at 0600.
- name: Remove the hostapd backups carrying the AP passphrase
  ansible.builtin.file:
    path: "/etc/hostapd/{{ item }}"
    state: absent
  loop:
    - hostapd.conf.broken-5ghz
    - hostapd.conf.wlan0-24

# --- admin plane -------------------------------------------------------------
# Why this is worth closing at all: see harden_ssh in defaults.
#
# A drop-in rather than an edit to sshd_config, so an OS upgrade cannot quietly
# revert it by winning a conffile prompt.
- name: Require key authentication for SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-rasputin.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      # Managed by rasputin. Keys only - see the role for why.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  when: harden_ssh | bool
  notify: reload ssh

# --- status tool -------------------------------------------------------------
# rasputin-status polls every couple of seconds and runs BatchMode, so it can
# answer no prompt. Its privileged probes used to arrive as a script piped into
# `sudo bash -s`, which no sudoers rule can narrow: allowing that is allowing
# root. A fixed root-owned script can be pinned by path instead.
#
# root-owned and not writable by {{ admin_user }} - the NOPASSWD rule below
# makes anyone who can edit this file root.
- name: Install the status facts script
  ansible.builtin.copy:
    src: rasputin-facts.sh
    dest: /usr/local/sbin/rasputin-facts
    owner: root
    group: root
    mode: "0755"

# Scoped to one path with no arguments, so it grants exactly the read-only
# probes above and nothing else. validate is the guard rail: an unparseable
# sudoers drop-in takes sudo down for every user on the box.
- name: Let the status tool read privileged facts without a password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/20-rasputin-status
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      # Managed by rasputin.
      {{ admin_user }} ALL=(root) NOPASSWD: /usr/local/sbin/rasputin-facts

# --- config ----------------------------------------------------------------
- name: Create netmode directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /usr/local/share/netmode
    - /etc/netmode

# default_mode is only a SEED (written once, force:false). The authoritative
# mode lives in /etc/netmode/mode and diverges the moment you run `netmode
# uplink`. Gating config on the seed meant a routine deploy at a hotel could
# install a DHCP server on the VENUE's ethernet - a rogue DHCP server on
# someone else's LAN, permanent when converge_on_deploy=false.
- name: Read the declared mode
  ansible.builtin.slurp:
    src: /etc/netmode/mode
  register: _mode_file
  failed_when: false
  changed_when: false

- name: Read the declared profile
  ansible.builtin.set_fact:
    _declared: "{{ (_mode_file.content | b64decode | trim) if (_mode_file.content is defined) else default_mode }}"

# /etc/netmode/mode holds a PROFILE name now, not a raw mode. Comparing it
# directly against 'serve' meant the profile 'home' - which IS serve - looked
# like an uplink, and the eth0 DHCP config was deleted out from under a
# downstream network that depends on it. Resolve through the same profile map
# netmode uses, so the two can never disagree.
- name: Resolve the profile to a mode
  ansible.builtin.set_fact:
    effective_mode: "{{ netmode_profiles[_declared].mode if (_declared in netmode_profiles) else _declared }}"

- name: Show which mode config is being applied for
  ansible.builtin.debug:
    msg: "declared profile = {{ _declared }} -> effective mode = {{ effective_mode }}"

- name: Base dnsmasq policy
  ansible.builtin.template:
    src: 10-base.conf.j2
    dest: /etc/dnsmasq.d/10-base.conf
    mode: "0644"
  notify: restart dnsmasq

- name: AP dnsmasq config (constant)
  ansible.builtin.template:
    src: 20-wlan1-ap.conf.j2
    dest: /etc/dnsmasq.d/20-wlan1-ap.conf
    mode: "0644"
  notify: restart dnsmasq

# Staged, not installed: netmode installs/removes it per mode.
- name: Stage the eth0-LAN snippet
  ansible.builtin.template:
    src: 30-eth0-lan.conf.j2
    dest: /usr/local/share/netmode/30-eth0-lan.conf
    mode: "0644"
  notify: converge netmode

# Skipped unless ap_passphrase is vaulted. Without this guard the run aborts on
# an undefined variable - or worse, renders an empty passphrase and drops every
# client currently associated to the AP.
# Without this, a deploy with converge_on_deploy=false deletes RaspAP's
# 090_eth0.conf and installs nothing in its place, because only `netmode
# converge` installs the snippet. dnsmasq would then restart with no DHCP on
# eth0 and every downstream WAN would lose its lease. netmode still owns this
# file afterwards - it removes it when switching to uplink mode.
- name: Install the eth0-LAN snippet when serving
  ansible.builtin.template:
    src: 30-eth0-lan.conf.j2
    dest: /etc/dnsmasq.d/30-eth0-lan.conf
    mode: "0644"
  when: effective_mode == 'serve'
  notify: restart dnsmasq

# Symmetric half: if we are an uplink, the LAN snippet must be ABSENT, not
# merely skipped, or a leftover from a previous serve deploy keeps serving DHCP.
- name: Remove the eth0-LAN snippet when eth0 is an uplink
  ansible.builtin.file:
    path: /etc/dnsmasq.d/30-eth0-lan.conf
    state: absent
  when: effective_mode != 'serve'
  notify: restart dnsmasq

- name: hostapd config
  ansible.builtin.template:
    src: hostapd.conf.j2
    dest: /etc/hostapd/hostapd.conf
    mode: "0600"
  when: ap_passphrase is defined and ap_passphrase | length > 0
  notify: hostapd changed

- name: Warn if hostapd is unmanaged
  ansible.builtin.debug:
    msg: "ap_passphrase undefined - leaving /etc/hostapd/hostapd.conf alone. Vault it to manage the AP."
  when: ap_passphrase is not defined or ap_passphrase | length == 0

# netfilter-persistent restores /etc/iptables/rules.v4 at every boot, which is
# where RaspAP's blanket masquerade comes back from. NAT belongs to nftables
# now, so the nat table is emptied. Docker adds its own rules at runtime and is
# unaffected. The 192.168.50.0/24 rule referenced a subnet that does not exist.
#
# Skipped once purge_iptables_persistent has removed the restorer and the
# directory this writes into: emptying a file nothing reads is at best a no-op,
# and here it is an error, because the task would have to recreate /etc/iptables
# to write it.
- name: Stop netfilter-persistent restoring RaspAP's blanket NAT
  ansible.builtin.copy:
    dest: /etc/iptables/rules.v4
    mode: "0644"
    backup: true
    content: |
      # Managed by rasputin. NAT is owned by nftables (table inet netmode).
      *nat
      :PREROUTING ACCEPT [0:0]
      :INPUT ACCEPT [0:0]
      :OUTPUT ACCEPT [0:0]
      :POSTROUTING ACCEPT [0:0]
      COMMIT
  when: not (purge_iptables_persistent | bool)

# wlan0 presents a fresh MAC to each SSID, and a random one while merely
# scanning - otherwise the real MAC is broadcast before you ever associate.
#
# The regexp is load-bearing. Without it lineinfile matches the whole literal,
# so when netmode has set mac_addr=0 to hold a captive-portal pin this APPENDS
# a second mac_addr= line instead of replacing it, and the file carries both.
# netmode re-asserts the pin on the converge at the end of a deploy, so a run
# during a pinned session heals itself.
- name: Randomise the wifi client MAC per network
  ansible.builtin.lineinfile:
    path: /etc/wpa_supplicant/wpa_supplicant.conf
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    insertbefore: BOF
    state: "{{ 'present' if (randomize_client_mac | default(true) | bool) else 'absent' }}"
  loop:
    - { key: mac_addr, value: 1 }
    - { key: preassoc_mac_addr, value: 1 }
  notify: restart wpa_supplicant

# Stop announcing ourselves to every venue's DHCP server. `hostname` sends
# the literal string "raspberrypi" to every network we join.
- name: Do not leak hostname to venue DHCP servers
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '^hostname$'
    replace: '#hostname   # rasputin: do not announce ourselves to venues'

# `clientid` is CORRECT here and must stay. Per dhcpcd.conf(5) a bare
# `clientid` derives the identifier from the hardware address, so it follows
# MAC randomisation. The stable-identifier trap is `duid` (DUID-LLT/UUID),
# which survives MAC changes and would defeat randomisation entirely.
# There is no `noclientid` option - dhcpcd rejects it as "unknown option".
- name: Keep the DHCP client identifier tied to the (randomised) MAC
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '^noclientid.*$'
    replace: 'clientid'

- name: Ensure no stable DUID overrides the MAC-derived clientid
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '^duid$'
    replace: '#duid  # rasputin: stable across MAC changes, defeats randomisation'

# --- DoH certificate ---------------------------------------------------------
# Must come before netmode is templated: netmode generates blocky's listen
# file, and whether that file has an https stanza depends on these two facts.

- name: Look for the DoH certificate on the controller
  ansible.builtin.stat:
    path: "{{ blocky_doh_local_dir | expanduser }}/{{ item }}"
  register: _doh_local
  loop: [rasputin-fullchain.crt, rasputin.key]
  delegate_to: localhost
  become: false
  changed_when: false

# Both or neither. Turning the listener on with only half the material means
# blocky fails to start, and there is no second resolver on this box.
- name: Enable the DoH listener only when both cert and key exist
  ansible.builtin.set_fact:
    blocky_doh_cert: "{{ blocky_doh_dir }}/rasputin-fullchain.crt"
    blocky_doh_key: "{{ blocky_doh_dir }}/rasputin.key"
  when: _doh_local.results | map(attribute='stat.exists') | select | list | length == 2

- name: Report that DoH is staying off
  ansible.builtin.debug:
    msg: "No cert at {{ blocky_doh_local_dir }} - DoH listener stays off, plain DNS only."
  when: blocky_doh_cert is not defined

# Baseline for a deploy that does not converge; netmode rewrites this per mode.
# See write_avahi_deny() for why: these are packets we send, so no inbound
# firewall rule can stop them reaching the venue.
- name: Stop avahi announcing this box to the venue
  community.general.ini_file:
    path: /etc/avahi/avahi-daemon.conf
    section: server
    option: deny-interfaces
    value: "{{ wan_wifi_if if effective_mode == 'serve' else wan_wifi_if ~ ',' ~ eth_if }}"
    mode: "0644"
    no_extra_spaces: true
  register: _avahi
  failed_when: false

- name: Restart avahi
  ansible.builtin.systemd:
    name: avahi-daemon
    state: restarted
  when: _avahi.changed | default(false)
  failed_when: false

- name: Install netmode
  ansible.builtin.template:
    src: netmode.j2
    dest: /usr/local/sbin/netmode
    mode: "0755"
  notify: converge netmode

- name: Converge-on-boot unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/netmode-converge.service
    mode: "0644"
    content: |
      [Unit]
      Description=Converge declared network mode
      # After wpa_supplicant@wlan0: converge randomises the wlan0 MAC and then
      # waits for reassociation - racing a cold-starting supplicant burned the
      # whole reassociate window at boot and skipped the venue-lateral rules.
      After=network-pre.target dhcpcd.service wpa_supplicant@wlan0.service
      Wants=network-pre.target wpa_supplicant@wlan0.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/netmode converge
      [Install]
      WantedBy=multi-user.target
  notify: reload systemd

- name: Seed the declared mode if unset
  ansible.builtin.copy:
    dest: /etc/netmode/mode
    content: "{{ default_mode }}\n"
    mode: "0644"
    force: false

- name: Enable services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    masked: false      # hostapd ships masked on Debian/RPi OS; enable errors on it
  loop: [dnsmasq, hostapd, dhcpcd, netmode-converge]

# --- resolver ---------------------------------------------------------------
# Ordering here is the whole cutover. The binary is fetched while dnsmasq is
# still answering DNS, because get_url runs ON the Pi and needs to resolve
# github.com; only then is dnsmasq demoted and blocky given the port.

- name: Create the blocky system user
  ansible.builtin.user:
    name: "{{ blocky_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/blocky
    create_home: false

- name: Create the DoH certificate directory
  ansible.builtin.file:
    path: "{{ blocky_doh_dir }}"
    state: directory
    owner: "{{ blocky_user }}"
    group: "{{ blocky_user }}"
    mode: "0750"
  when: blocky_doh_cert is defined

- name: Install the DoH chain
  ansible.builtin.copy:
    src: "{{ blocky_doh_local_dir | expanduser }}/rasputin-fullchain.crt"
    dest: "{{ blocky_doh_cert }}"
    owner: "{{ blocky_user }}"
    group: "{{ blocky_user }}"
    mode: "0444"
  when: blocky_doh_cert is defined
  notify: restart blocky

# The leaf key is the only private key that goes anywhere near this box. The
# root and intermediate keys stay on the controller.
- name: Install the DoH key
  ansible.builtin.copy:
    src: "{{ blocky_doh_local_dir | expanduser }}/rasputin.key"
    dest: "{{ blocky_doh_key }}"
    owner: "{{ blocky_user }}"
    group: "{{ blocky_user }}"
    mode: "0400"
  when: blocky_doh_key is defined
  no_log: true
  notify: restart blocky

- name: Create blocky config directory
  ansible.builtin.file:
    path: /etc/blocky/config.d
    state: directory
    mode: "0755"

- name: Check the installed blocky version
  ansible.builtin.command: /usr/local/bin/blocky version
  register: _blocky_installed
  changed_when: false
  failed_when: false

# Pinned by checksum, not just by tag: a release tag can be moved, and this
# binary is the box's only resolver.
- name: Download blocky
  ansible.builtin.get_url:
    url: "https://github.com/0xERR0R/blocky/releases/download/{{ blocky_version }}/blocky_{{ blocky_version }}_Linux_arm64.tar.gz"
    dest: /tmp/blocky.tar.gz
    checksum: "sha256:{{ blocky_sha256 }}"
    mode: "0600"
  when: blocky_version not in (_blocky_installed.stdout | default(''))

- name: Install blocky
  ansible.builtin.unarchive:
    src: /tmp/blocky.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include: [blocky]
    owner: root
    group: root
    mode: "0755"
  when: blocky_version not in (_blocky_installed.stdout | default(''))
  notify: restart blocky

- name: Remove the blocky tarball
  ansible.builtin.file:
    path: /tmp/blocky.tar.gz
    state: absent

- name: Base resolver policy
  ansible.builtin.template:
    src: blocky-10-base.yml.j2
    dest: /etc/blocky/config.d/10-base.yml
    mode: "0644"
  notify: restart blocky

# netmode rewrites this on every converge - the DoH endpoints normally, the
# venue's own resolver in plaintext while a captive portal is being cleared.
# Written here as well so a deploy with converge_on_deploy=false still leaves
# blocky an upstream at all; a blocky with none fails to start, and this box
# has no second resolver.
- name: Resolver upstreams
  ansible.builtin.template:
    src: blocky-15-upstream.yml.j2
    dest: /etc/blocky/config.d/15-upstream.yml
    mode: "0644"
  notify: restart blocky

# netmode rewrites this on every converge. Written here as well so a deploy
# with converge_on_deploy=false still leaves a resolver that can bind - the
# same reason the eth0-LAN snippet is installed rather than merely staged.
- name: Resolver listen addresses for the current mode
  ansible.builtin.template:
    src: blocky-20-listen.yml.j2
    dest: /etc/blocky/config.d/20-listen.yml
    mode: "0644"
  vars:
    blocky_listen_addrs: "{{ ['127.0.0.1:53', ap_subnet ~ '.1:53'] + ([eth_subnet ~ '.1:53'] if effective_mode == 'serve' else []) }}"
    blocky_listen_https: "{{ [ap_subnet ~ '.1:' ~ blocky_doh_port] + ([eth_subnet ~ '.1:' ~ blocky_doh_port] if effective_mode == 'serve' else []) }}"
  notify: restart blocky

- name: blocky unit
  ansible.builtin.template:
    src: blocky.service.j2
    dest: /etc/systemd/system/blocky.service
    mode: "0644"
  notify:
    - reload systemd
    - restart blocky

# wg-quick applies "DNS =" from wg0.conf by rewriting /etc/resolv.conf, which
# would send the box's OWN lookups to Proton's resolver and straight past
# blocky - no blocklist, no DoH. The tunnel does not need it: clients are told
# their resolver by DHCP, and this box is told by resolv.conf below.
- name: Stop wg-quick hijacking the box's resolver
  ansible.builtin.replace:
    path: "/etc/wireguard/{{ vpn_interface }}.conf"
    regexp: '^DNS\s*=.*$'
    replace: '# DNS = removed by rasputin: this box resolves via blocky on 127.0.0.1'
  failed_when: false

- name: Point the box at its own resolver
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    mode: "0644"
    content: |
      # Managed by rasputin. This box resolves through blocky like any client,
      # so its own lookups are filtered and leave over DoH.
      nameserver 127.0.0.1
      options timeout:2 attempts:2

# THE CUTOVER. Everything above is inert until dnsmasq lets go of :53.
- name: Apply the pending dnsmasq and blocky changes now
  ansible.builtin.meta: flush_handlers

# dnsmasq uses bind-dynamic, so it holds the specific LAN addresses rather
# than a wildcard - but they are the exact addresses blocky needs, so it still
# has to be gone before blocky starts.
- name: Confirm nothing still holds port 53
  ansible.builtin.shell: |
    set -o pipefail
    ss -lnup 'sport = :53'; ss -lntp 'sport = :53'
  args: {executable: /bin/bash}
  register: _port53
  changed_when: false
  failed_when: "'blocky' not in _port53.stdout and _port53.stdout is search(':53')"

- name: Enable and start blocky
  ansible.builtin.systemd:
    name: blocky
    enabled: true
    state: started
    daemon_reload: true

# Proves the resolver actually resolves, rather than merely that systemd
# thinks the unit is running.
- name: Verify the resolver answers
  ansible.builtin.command: /usr/local/bin/blocky healthcheck
  register: _blocky_health
  until: _blocky_health.rc == 0
  retries: 10
  delay: 3
  changed_when: false
