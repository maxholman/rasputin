---
# No update_cache: this box's own DNS is fail-closed (099-upstream.conf points
# at a Proton resolver inside a WireGuard tunnel that isn't up), so apt cannot
# resolve deb.debian.org and a refresh fails hard. With state=present and the
# packages already installed, no network is needed at all. Re-enable the cache
# refresh only once the Pi can resolve names.
- name: Install router packages
  ansible.builtin.apt:
    name: [dnsmasq, hostapd, dhcpcd5, nftables]
    state: present

# --- RaspAP-ectomy (opt-in: -e purge_raspap=true) --------------------------
# Only the web UI/daemon removal is opt-in; the config fragments above are not.
- name: Stop and disable RaspAP services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [raspapd, lighttpd]
  failed_when: false
  when: purge_raspap | default(false) | bool

# NOT optional. These cannot coexist with ours - verified with dnsmasq --test:
# 090_raspap.conf and 10-base.conf both set log-facility, which dnsmasq rejects
# as "illegal repeated keyword", and 090_wlan1.conf duplicates our wlan1
# dhcp-range. Leaving them in place means dnsmasq refuses to start at all.
# 090_adblock.conf and 099-upstream.conf are left alone; they don't conflict.
- name: Remove conflicting RaspAP dnsmasq fragments
  ansible.builtin.file:
    path: "/etc/dnsmasq.d/{{ item }}"
    state: absent
  loop:
    - 090_raspap.conf
    - 090_wlan0.conf   # should never have existed: wlan0 is always a client
    - 090_wlan1.conf
    - 090_eth0.conf
  notify: restart dnsmasq

# --- config ----------------------------------------------------------------
- name: Create netmode directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /usr/local/share/netmode
    - /etc/netmode

# default_mode is only a SEED (written once, force:false). The authoritative
# mode lives in /etc/netmode/mode and diverges the moment you run `netmode
# uplink`. Gating config on the seed meant a routine deploy at a hotel could
# install a DHCP server on the VENUE's ethernet - a rogue DHCP server on
# someone else's LAN, permanent when converge_on_deploy=false.
- name: Read the declared mode
  ansible.builtin.slurp:
    src: /etc/netmode/mode
  register: _mode_file
  failed_when: false
  changed_when: false

- name: Read the declared profile
  ansible.builtin.set_fact:
    _declared: "{{ (_mode_file.content | b64decode | trim) if (_mode_file.content is defined) else default_mode }}"

# /etc/netmode/mode holds a PROFILE name now, not a raw mode. Comparing it
# directly against 'serve' meant the profile 'home' - which IS serve - looked
# like an uplink, and the eth0 DHCP config was deleted out from under a
# downstream network that depends on it. Resolve through the same profile map
# netmode uses, so the two can never disagree.
- name: Resolve the profile to a mode
  ansible.builtin.set_fact:
    effective_mode: "{{ netmode_profiles[_declared].mode if (_declared in netmode_profiles) else _declared }}"

- name: Show which mode config is being applied for
  ansible.builtin.debug:
    msg: "declared profile = {{ _declared }} -> effective mode = {{ effective_mode }}"

- name: Base dnsmasq policy
  ansible.builtin.template:
    src: 10-base.conf.j2
    dest: /etc/dnsmasq.d/10-base.conf
    mode: "0644"
  notify: restart dnsmasq

- name: AP dnsmasq config (constant)
  ansible.builtin.template:
    src: 20-wlan1-ap.conf.j2
    dest: /etc/dnsmasq.d/20-wlan1-ap.conf
    mode: "0644"
  notify: restart dnsmasq

# Staged, not installed: netmode installs/removes it per mode.
- name: Stage the eth0-LAN snippet
  ansible.builtin.template:
    src: 30-eth0-lan.conf.j2
    dest: /usr/local/share/netmode/30-eth0-lan.conf
    mode: "0644"
  notify: converge netmode

# Skipped unless ap_passphrase is vaulted. Without this guard the run aborts on
# an undefined variable - or worse, renders an empty passphrase and drops every
# client currently associated to the AP.
# Without this, a deploy with converge_on_deploy=false deletes RaspAP's
# 090_eth0.conf and installs nothing in its place, because only `netmode
# converge` installs the snippet. dnsmasq would then restart with no DHCP on
# eth0 and every downstream WAN would lose its lease. netmode still owns this
# file afterwards - it removes it when switching to uplink mode.
- name: Install the eth0-LAN snippet when serving
  ansible.builtin.template:
    src: 30-eth0-lan.conf.j2
    dest: /etc/dnsmasq.d/30-eth0-lan.conf
    mode: "0644"
  when: effective_mode == 'serve'
  notify: restart dnsmasq

# Symmetric half: if we are an uplink, the LAN snippet must be ABSENT, not
# merely skipped, or a leftover from a previous serve deploy keeps serving DHCP.
- name: Remove the eth0-LAN snippet when eth0 is an uplink
  ansible.builtin.file:
    path: /etc/dnsmasq.d/30-eth0-lan.conf
    state: absent
  when: effective_mode != 'serve'
  notify: restart dnsmasq

- name: hostapd config
  ansible.builtin.template:
    src: hostapd.conf.j2
    dest: /etc/hostapd/hostapd.conf
    mode: "0600"
  when: ap_passphrase is defined and ap_passphrase | length > 0
  notify: hostapd changed

- name: Warn if hostapd is unmanaged
  ansible.builtin.debug:
    msg: "ap_passphrase undefined - leaving /etc/hostapd/hostapd.conf alone. Vault it to manage the AP."
  when: ap_passphrase is not defined or ap_passphrase | length == 0

# netfilter-persistent restores /etc/iptables/rules.v4 at every boot, which is
# where RaspAP's blanket masquerade comes back from. NAT belongs to nftables
# now, so the nat table is emptied. Docker adds its own rules at runtime and is
# unaffected. The 192.168.50.0/24 rule referenced a subnet that does not exist.
- name: Stop netfilter-persistent restoring RaspAP's blanket NAT
  ansible.builtin.copy:
    dest: /etc/iptables/rules.v4
    mode: "0644"
    backup: true
    content: |
      # Managed by rasputin. NAT is owned by nftables (table inet netmode).
      *nat
      :PREROUTING ACCEPT [0:0]
      :INPUT ACCEPT [0:0]
      :OUTPUT ACCEPT [0:0]
      :POSTROUTING ACCEPT [0:0]
      COMMIT

# wlan0 presents a fresh MAC to each SSID, and a random one while merely
# scanning - otherwise the real MAC is broadcast before you ever associate.
- name: Randomise the wifi client MAC per network
  ansible.builtin.lineinfile:
    path: /etc/wpa_supplicant/wpa_supplicant.conf
    line: "{{ item }}"
    insertbefore: BOF
    state: "{{ 'present' if (randomize_client_mac | default(true) | bool) else 'absent' }}"
  loop:
    - mac_addr=1
    - preassoc_mac_addr=1
  notify: restart wpa_supplicant

# Stop announcing ourselves to every venue's DHCP server. `hostname` sends
# the literal string "raspberrypi" to every network we join.
- name: Do not leak hostname to venue DHCP servers
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '^hostname$'
    replace: '#hostname   # rasputin: do not announce ourselves to venues'

# `clientid` is CORRECT here and must stay. Per dhcpcd.conf(5) a bare
# `clientid` derives the identifier from the hardware address, so it follows
# MAC randomisation. The stable-identifier trap is `duid` (DUID-LLT/UUID),
# which survives MAC changes and would defeat randomisation entirely.
# There is no `noclientid` option - dhcpcd rejects it as "unknown option".
- name: Keep the DHCP client identifier tied to the (randomised) MAC
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '^noclientid.*$'
    replace: 'clientid'

- name: Ensure no stable DUID overrides the MAC-derived clientid
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '^duid$'
    replace: '#duid  # rasputin: stable across MAC changes, defeats randomisation'

# --- DoH certificate ---------------------------------------------------------
# Must come before netmode is templated: netmode generates blocky's listen
# file, and whether that file has an https stanza depends on these two facts.

- name: Look for the DoH certificate on the controller
  ansible.builtin.stat:
    path: "{{ blocky_doh_local_dir | expanduser }}/{{ item }}"
  register: _doh_local
  loop: [rasputin-fullchain.crt, rasputin.key]
  delegate_to: localhost
  become: false
  changed_when: false

# Both or neither. Turning the listener on with only half the material means
# blocky fails to start, and there is no second resolver on this box.
- name: Enable the DoH listener only when both cert and key exist
  ansible.builtin.set_fact:
    blocky_doh_cert: "{{ blocky_doh_dir }}/rasputin-fullchain.crt"
    blocky_doh_key: "{{ blocky_doh_dir }}/rasputin.key"
  when: _doh_local.results | map(attribute='stat.exists') | select | list | length == 2

- name: Report that DoH is staying off
  ansible.builtin.debug:
    msg: "No cert at {{ blocky_doh_local_dir }} - DoH listener stays off, plain DNS only."
  when: blocky_doh_cert is not defined

# Baseline for a deploy that does not converge; netmode rewrites this per mode.
# See write_avahi_deny() for why: these are packets we send, so no inbound
# firewall rule can stop them reaching the venue.
- name: Stop avahi announcing this box to the venue
  community.general.ini_file:
    path: /etc/avahi/avahi-daemon.conf
    section: server
    option: deny-interfaces
    value: "{{ wan_wifi_if if effective_mode == 'serve' else wan_wifi_if ~ ',' ~ eth_if }}"
    mode: "0644"
    no_extra_spaces: true
  register: _avahi
  failed_when: false

- name: Restart avahi
  ansible.builtin.systemd:
    name: avahi-daemon
    state: restarted
  when: _avahi.changed | default(false)
  failed_when: false

- name: Install netmode
  ansible.builtin.template:
    src: netmode.j2
    dest: /usr/local/sbin/netmode
    mode: "0755"
  notify: converge netmode

- name: Converge-on-boot unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/netmode-converge.service
    mode: "0644"
    content: |
      [Unit]
      Description=Converge declared network mode
      After=network-pre.target dhcpcd.service
      Wants=network-pre.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/netmode converge
      [Install]
      WantedBy=multi-user.target
  notify: reload systemd

- name: Seed the declared mode if unset
  ansible.builtin.copy:
    dest: /etc/netmode/mode
    content: "{{ default_mode }}\n"
    mode: "0644"
    force: false

- name: Enable services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    masked: false      # hostapd ships masked on Debian/RPi OS; enable errors on it
  loop: [dnsmasq, hostapd, dhcpcd, netmode-converge]

# --- resolver ---------------------------------------------------------------
# Ordering here is the whole cutover. The binary is fetched while dnsmasq is
# still answering DNS, because get_url runs ON the Pi and needs to resolve
# github.com; only then is dnsmasq demoted and blocky given the port.

- name: Create the blocky system user
  ansible.builtin.user:
    name: "{{ blocky_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/blocky
    create_home: false

- name: Create the DoH certificate directory
  ansible.builtin.file:
    path: "{{ blocky_doh_dir }}"
    state: directory
    owner: "{{ blocky_user }}"
    group: "{{ blocky_user }}"
    mode: "0750"
  when: blocky_doh_cert is defined

- name: Install the DoH chain
  ansible.builtin.copy:
    src: "{{ blocky_doh_local_dir | expanduser }}/rasputin-fullchain.crt"
    dest: "{{ blocky_doh_cert }}"
    owner: "{{ blocky_user }}"
    group: "{{ blocky_user }}"
    mode: "0444"
  when: blocky_doh_cert is defined
  notify: restart blocky

# The leaf key is the only private key that goes anywhere near this box. The
# root and intermediate keys stay on the controller.
- name: Install the DoH key
  ansible.builtin.copy:
    src: "{{ blocky_doh_local_dir | expanduser }}/rasputin.key"
    dest: "{{ blocky_doh_key }}"
    owner: "{{ blocky_user }}"
    group: "{{ blocky_user }}"
    mode: "0400"
  when: blocky_doh_key is defined
  no_log: true
  notify: restart blocky

- name: Create blocky config directory
  ansible.builtin.file:
    path: /etc/blocky/config.d
    state: directory
    mode: "0755"

- name: Check the installed blocky version
  ansible.builtin.command: /usr/local/bin/blocky version
  register: _blocky_installed
  changed_when: false
  failed_when: false

# Pinned by checksum, not just by tag: a release tag can be moved, and this
# binary is the box's only resolver.
- name: Download blocky
  ansible.builtin.get_url:
    url: "https://github.com/0xERR0R/blocky/releases/download/{{ blocky_version }}/blocky_{{ blocky_version }}_Linux_arm64.tar.gz"
    dest: /tmp/blocky.tar.gz
    checksum: "sha256:{{ blocky_sha256 }}"
    mode: "0600"
  when: blocky_version not in (_blocky_installed.stdout | default(''))

- name: Install blocky
  ansible.builtin.unarchive:
    src: /tmp/blocky.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include: [blocky]
    owner: root
    group: root
    mode: "0755"
  when: blocky_version not in (_blocky_installed.stdout | default(''))
  notify: restart blocky

- name: Remove the blocky tarball
  ansible.builtin.file:
    path: /tmp/blocky.tar.gz
    state: absent

- name: Base resolver policy
  ansible.builtin.template:
    src: blocky-10-base.yml.j2
    dest: /etc/blocky/config.d/10-base.yml
    mode: "0644"
  notify: restart blocky

# netmode rewrites this on every converge. Written here as well so a deploy
# with converge_on_deploy=false still leaves a resolver that can bind - the
# same reason the eth0-LAN snippet is installed rather than merely staged.
- name: Resolver listen addresses for the current mode
  ansible.builtin.template:
    src: blocky-20-listen.yml.j2
    dest: /etc/blocky/config.d/20-listen.yml
    mode: "0644"
  vars:
    blocky_listen_addrs: "{{ ['127.0.0.1:53', ap_subnet ~ '.1:53'] + ([eth_subnet ~ '.1:53'] if effective_mode == 'serve' else []) }}"
    blocky_listen_https: "{{ [ap_subnet ~ '.1:' ~ blocky_doh_port] + ([eth_subnet ~ '.1:' ~ blocky_doh_port] if effective_mode == 'serve' else []) }}"
  notify: restart blocky

- name: blocky unit
  ansible.builtin.template:
    src: blocky.service.j2
    dest: /etc/systemd/system/blocky.service
    mode: "0644"
  notify:
    - reload systemd
    - restart blocky

# wg-quick applies "DNS =" from wg0.conf by rewriting /etc/resolv.conf, which
# would send the box's OWN lookups to Proton's resolver and straight past
# blocky - no blocklist, no DoH. The tunnel does not need it: clients are told
# their resolver by DHCP, and this box is told by resolv.conf below.
- name: Stop wg-quick hijacking the box's resolver
  ansible.builtin.replace:
    path: "/etc/wireguard/{{ vpn_interface }}.conf"
    regexp: '^DNS\s*=.*$'
    replace: '# DNS = removed by rasputin: this box resolves via blocky on 127.0.0.1'
  failed_when: false

- name: Point the box at its own resolver
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    mode: "0644"
    content: |
      # Managed by rasputin. This box resolves through blocky like any client,
      # so its own lookups are filtered and leave over DoH.
      nameserver 127.0.0.1
      options timeout:2 attempts:2

# THE CUTOVER. Everything above is inert until dnsmasq lets go of :53.
- name: Apply the pending dnsmasq and blocky changes now
  ansible.builtin.meta: flush_handlers

# dnsmasq uses bind-dynamic, so it holds the specific LAN addresses rather
# than a wildcard - but they are the exact addresses blocky needs, so it still
# has to be gone before blocky starts.
- name: Confirm nothing still holds port 53
  ansible.builtin.shell: |
    set -o pipefail
    ss -lnup 'sport = :53'; ss -lntp 'sport = :53'
  args: {executable: /bin/bash}
  register: _port53
  changed_when: false
  failed_when: "'blocky' not in _port53.stdout and _port53.stdout is search(':53')"

- name: Enable and start blocky
  ansible.builtin.systemd:
    name: blocky
    enabled: true
    state: started
    daemon_reload: true

# Proves the resolver actually resolves, rather than merely that systemd
# thinks the unit is running.
- name: Verify the resolver answers
  ansible.builtin.command: /usr/local/bin/blocky healthcheck
  register: _blocky_health
  until: _blocky_health.rc == 0
  retries: 10
  delay: 3
  changed_when: false
