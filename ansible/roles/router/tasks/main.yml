---
# No update_cache: this box's DNS is fail-closed by design - blocky answers only
# over a DoH upstream, and the kill switch drops that egress whenever the tunnel
# is down - so a refresh cannot resolve deb.debian.org and fails hard. With
# state=present and the packages already installed, no network is needed at all.
- name: Install router packages
  ansible.builtin.apt:
    name: [dnsmasq, hostapd, dhcpcd5, nftables]
    state: present

# Separate, and allowed to fail, precisely because of the comment above: this
# one is not already on the box, so it is the only apt task here that needs a
# working uplink. A deploy at a venue with no internet must not die on it -
# `rasputin refresh` warns and leaves the stale NAT bindings to time out, which
# is what happens today anyway.
- name: Install conntrack, so a renumbered uplink can drop its stale NAT bindings
  ansible.builtin.apt:
    name: conntrack
    state: present
  register: _conntrack_pkg
  failed_when: false

- name: Warn if conntrack could not be installed
  ansible.builtin.debug:
    msg: "conntrack not installed - after an uplink renumbers, flows will hang until conntrack times them out"
  when: _conntrack_pkg.failed | default(false)

# raspapd's boot job was, undocumented, the only thing starting wpa_supplicant
# on wlan0. The first reboot after masking it came up with the AP beaconing
# and a dead WAN - the whole house lost internet. The instance unit is the
# boot-time owner now; rasputin's MAC-randomise/reassociate flow needs a
# running supplicant and provides nothing of its own.
- name: Link the wlan0 supplicant config for the instance unit
  ansible.builtin.file:
    src: wpa_supplicant.conf
    dest: /etc/wpa_supplicant/wpa_supplicant-wlan0.conf
    state: link

- name: Enable wpa_supplicant on the wifi WAN
  ansible.builtin.systemd:
    name: wpa_supplicant@wlan0
    enabled: true

# nftables.service loads this at every boot, which makes it a second author of
# the packet path beside table inet rasputin. It arrived carrying base chains at
# the same hooks and a standing `oifname {{ eth_if }} masquerade` - in uplink
# mode, a masquerade out the venue's leg that nothing sanctioned.
#
# Emptied, and deliberately NOT given a `flush ruleset`: nftables.service and
# rasputin-converge have no ordering between them, so a flush here would wipe
# the live table on whichever boot it happened to run second.
- name: Keep /etc/nftables.conf inert
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    mode: "0644"
    backup: true
    content: |
      #!/usr/sbin/nft -f
      # Managed by rasputin. The live ruleset is table inet rasputin, written by
      # rasputin at every converge and rebuilt at boot. Nothing else claims a
      # hook here - no flush on purpose, see the role task.

# --- the minute the boot spends waiting -------------------------------------
# See disable_nm_wait_online. Masked rather than disabled: network-online.target
# Wants it, so disabling alone leaves it one dependency away from coming back,
# and a Wants on a masked unit is skipped rather than fatal.
- name: Stop NetworkManager-wait-online holding up the boot
  ansible.builtin.systemd:
    name: NetworkManager-wait-online.service
    state: stopped
    enabled: false
    masked: true
  failed_when: false
  when: disable_nm_wait_online | bool

# --- who owns which interface ------------------------------------------------
# NetworkManager ships with the image and cannot be purged (iptables depends on
# it), so the only question is what it is allowed to touch. The answer is
# nothing: dhcpcd owns every address on this box, wpa_supplicant owns the uplink
# association.
#
# {{ eth_if }} was missing from the undeclared list this replaces, and in serve
# mode that interface carries the LAN's gateway address. NM claimed it, ran DHCP
# against a network whose only DHCP server is us, failed on the 45s timeout, and
# tore the address off the interface on its way out - once per failed
# activation, for as long as it kept retrying. Measured, not inferred: dhcpcd
# logs the pid that deleted the address, and it is NetworkManager's.
- name: NetworkManager owns none of this router's interfaces
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/99-rasputin-unmanaged.conf
    mode: "0644"
    content: |
      # Managed by Ansible. Edit the role, not this file.
      [main]
      dns=none

      [keyfile]
      unmanaged-devices=interface-name:{{ eth_if }};interface-name:{{ wan_wifi_if }};interface-name:{{ ap_if }}
  notify: reload NetworkManager

# --- the log that outlives the reboot ----------------------------------------
# Raspberry Pi OS ships 40-rpi-volatile-storage.conf with Storage=volatile, so
# the journal lives in /run and a reboot takes it. On a box whose failure report
# is "it stopped working so I power cycled it", that guarantees the one boot
# worth reading is the one that no longer exists. Capped, because the SD card is
# what wears out.
- name: Directory for the journald drop-in
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Keep the journal across reboots
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-rasputin-persistent.conf
    mode: "0644"
    content: |
      # Managed by Ansible. Edit the role, not this file.
      [Journal]
      Storage=persistent
      SystemMaxUse=200M
      SystemMaxFileSize=20M
  notify: restart journald

# dpkg writes a .dpkg-dist beside any conffile it did not overwrite, which with
# --force-confold on an upgrade means every packaged config this box declares
# for itself. They are inert, and each one is a second copy of a config file
# with no indication of which is live - the same confusion debian.sources.bak
# caused. Every config that matters here is written by this role, so the
# packaged variant carries nothing we act on.
#
# The trade-off, stated: this also discards the only notice that an upstream
# conffile changed. Acceptable on a box whose configs are declared and
# re-asserted at every converge; it would not be on a general-purpose machine.
- name: Find dpkg's leftover copies of config files
  ansible.builtin.find:
    paths: /etc
    patterns: ["*.dpkg-dist", "*.dpkg-old", "*.dpkg-new", "*.ucf-dist"]
    recurse: true
  register: _dpkg_leftovers

- name: Remove dpkg's leftover copies
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _dpkg_leftovers.files | default([]) | map(attribute='path') | list }}"

# --- apt sources -------------------------------------------------------------
# Declared because the undeclared version is how this box came to point at a
# mirror that completes a TLS handshake and then never answers - with a .bak of
# the stock file sitting beside it, which is the shape of a hand edit nobody
# wrote down. deb.debian.org is what a stock install uses, and it answers.
#
# apt only reads .sources and .list here, so the .bak was inert; it goes
# because a stale copy of a config file is a thing the next person has to
# work out the status of.
- name: Declare the Debian apt sources
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/debian.sources
    mode: "0644"
    backup: true
    content: |
      # Managed by rasputin.
      Types: deb
      URIs: http://deb.debian.org/debian/
      Suites: {{ debian_suite }} {{ debian_suite }}-updates
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp

      Types: deb
      URIs: http://deb.debian.org/debian-security/
      Suites: {{ debian_suite }}-security
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp
  when: manage_apt_sources | bool

# The mce888 deploy key carried no from= or command= restriction on an account
# with passwordless sudo, so a key minted to ship a container in another project
# held full root here. It goes by not being listed, rather than by being matched
# and deleted - which is the difference between a file that is audited and a
# file that is patched.
#
# The assert is the lockout guard: a typo that renders admin_ssh_keys empty
# would otherwise write an empty file and take the next connection with it.
- name: Refuse to write an empty authorized_keys
  ansible.builtin.assert:
    that:
      - admin_ssh_keys | length > 0
      - admin_ssh_keys | select('match', '^(ssh|ecdsa)-') | list | length == admin_ssh_keys | length
    fail_msg: "admin_ssh_keys is empty or malformed - refusing to write authorized_keys"
    quiet: true

# --- the admin account ------------------------------------------------------
# See admin_user. The account the SD card image shipped with was never declared
# here, which is why nothing creates it; this declares its replacement. A
# rebuild from bare metal needs the password set by hand once - there is no
# secret for it in the vault, on purpose.
- name: Create the admin account
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: "{{ admin_groups }}"
    append: true
    shell: /bin/bash
    create_home: true
  no_log: true

- name: Give the admin account an ssh directory
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    mode: "0700"

# Looped, not joined: Ansible leaves the \n in join('\n') as two literal
# characters, so every key past the first lands on a line sshd cannot parse.
- name: Declare who may log in
  ansible.builtin.copy:
    dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
    owner: "{{ admin_user }}"
    mode: "0600"
    backup: true
    content: |
      # Managed by rasputin - declared in admin_ssh_keys. Edits here are lost.
      {% for key in admin_ssh_keys %}
      {{ key }}
      {% endfor %}

# --- secrets the old stack left readable -------------------------------------
# RaspAP-era ownership: the wireguard configs are www-data-owned and 0644, so
# the tunnel's private key is readable by every account on the box. They are
# also the one thing this role cannot rebuild from the repo - the key exists
# nowhere else - which makes these permissions the only thing standing over an
# identity a dead SD card would take with it.
- name: Find the wireguard configs
  ansible.builtin.find:
    paths: "/etc/wireguard"
    patterns: "*"          # not just *.conf - wg0.conf.bak holds a key too
    file_type: file        # wg0.conf is a symlink; its target is matched anyway
  register: _wg_confs

- name: Lock the wireguard configs to root
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ _wg_confs.files }}"
  loop_control:
    label: "{{ item.path }}"

# --- admin plane -------------------------------------------------------------
# Why this is worth closing at all: see harden_ssh in defaults.
#
# A drop-in rather than an edit to sshd_config, so an OS upgrade cannot quietly
# revert it by winning a conffile prompt.
- name: Require key authentication for SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-rasputin.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      # Managed by rasputin. Keys only - see the role for why.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  when: harden_ssh | bool
  notify: reload ssh

# --- status tool -------------------------------------------------------------
# rasputin-status polls every couple of seconds and runs BatchMode, so it can
# answer no prompt. Its privileged probes used to arrive as a script piped into
# `sudo bash -s`, which no sudoers rule can narrow: allowing that is allowing
# root. A fixed root-owned script can be pinned by path instead.
#
# root-owned and not writable by {{ admin_user }} - the NOPASSWD rule below
# makes anyone who can edit this file root.
- name: Install the status facts script
  ansible.builtin.copy:
    src: rasputin-facts.sh
    dest: /usr/local/sbin/rasputin-facts
    owner: root
    group: root
    mode: "0755"

# Scoped to one path with no arguments, so it grants exactly the read-only
# probes above and nothing else. validate is the guard rail: an unparseable
# sudoers drop-in takes sudo down for every user on the box.
- name: Let the status tool read privileged facts without a password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/20-rasputin-status
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      # Managed by rasputin.
      {{ admin_user }} ALL=(root) NOPASSWD: /usr/local/sbin/rasputin-facts

# Only the verbs needed at a venue you cannot yet reach the internet from.
# The password is not a formality here: {{ admin_user }} holds an ssh key, and
# without a prompt anything holding that key - a forwarded agent, a script
# running in that shell - could drop the protections this box exists to
# provide. rollback-fire deletes the ruleset outright, portal takes the tunnel
# down and puts DNS in clear, and a profile switch turns the kill switch off:
# those keep their prompt. join and forget only steer the uplink, which
# {{ admin_user }} can already do - being in netdev reaches the supplicant's
# control socket with no sudo at all.
#
# Getting a pattern wrong here fails CLOSED: an unmatched command falls back to
# asking for the password. Nor can one widen to another verb, because the word
# after the path is a literal.
- name: Let the admin join a venue network without a password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/21-rasputin
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      # Managed by rasputin.
      {{ admin_user }} ALL=(root) NOPASSWD: /usr/local/sbin/rasputin join, /usr/local/sbin/rasputin join *
      {{ admin_user }} ALL=(root) NOPASSWD: /usr/local/sbin/rasputin forget, /usr/local/sbin/rasputin forget *

# Which spelling of `rasputin` a shell finds depends on the shell, and the two
# disagree: a login shell searches /usr/local/sbin FIRST, while `ssh host cmd`
# carries no sbin directory at all. Measured on this box, not assumed. A second
# script on /usr/local/bin would therefore be reached from one and bypassed by
# the other. A symlink to the same file is reached either way, and rasputin
# itself re-enters through sudo when it is not already root - so both spellings
# work and one sudoers rule still governs one path.
- name: Put rasputin within reach of a non-login PATH
  ansible.builtin.file:
    src: /usr/local/sbin/rasputin
    dest: /usr/local/bin/rasputin
    state: link

# nftables.service ships ExecStop=nft flush ruleset, and it is enabled. Any
# restart of it - which `apt upgrade` performs whenever the nftables package
# moves - flushes table inet rasputin along with everything else: no
# masquerade, no input filtering, no marker, no warning, until the next
# converge or uplink renumber happens to rebuild it. An empty ExecStop= clears
# the inherited one without masking the unit, which still has to be able to
# load /etc/nftables.conf (deliberately inert, see above).
- name: Give nftables.service somewhere to put its shutdown flush
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: "0755"

- name: Stop nftables.service flushing rasputin's ruleset on restart
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/10-no-flush.conf
    mode: "0644"
    content: |
      # Managed by rasputin.
      [Service]
      ExecStop=
  notify: reload systemd

# blocky binds DoH on the LAN addresses at startup, and dhcpcd has not always
# assigned them by then - hostapd raises wlan1's carrier concurrently, so
# 10.9.141.1 may not exist yet. The unit's Restart= eventually wins, at the
# cost of failed binds and a window with no DNS on every boot; with eth0
# unplugged in serve mode 10.6.141.1 never arrives and it never converges.
#
# Binding an address the box does not hold yet is exactly what this sysctl is
# for. It removes the race rather than racing better, and it needs no ordering
# against converge - which could not be expressed anyway, since converge
# restarts blocky itself and the dependency would deadlock.
- name: Let blocky bind LAN addresses before dhcpcd assigns them
  ansible.builtin.copy:
    dest: /etc/sysctl.d/30-rasputin-bind.conf
    mode: "0644"
    content: |
      # Managed by rasputin.
      net.ipv4.ip_nonlocal_bind=1
  notify: reload sysctl

# RaspAP left forwarding on at boot, which converge would set anyway - but
# converge sets it alongside a ruleset, and this sets it alone. Before the
# first converge, or after one that died, the difference is a box that forwards
# the LAN out of a venue's leg with no NAT and no filtering rather than one
# that simply does not forward.
- name: Stop forwarding before there is a firewall to forward through
  ansible.builtin.file:
    path: /etc/sysctl.d/90_raspap.conf
    state: absent
  notify: reload sysctl

# ExecStart is prefixed "-" and nothing Requires= this unit: if it fails, boot
# carries on and hostapd comes up on the hardware address. An AP that does not
# start is unrecoverable without a keyboard, and no privacy gain is worth it.
- name: Randomise the AP's BSSID before hostapd claims it
  ansible.builtin.copy:
    dest: /etc/systemd/system/rasputin-ap-mac.service
    mode: "0644"
    content: |
      # Managed by rasputin.
      [Unit]
      Description=Give the access point a fresh BSSID
      Before=hostapd.service
      After=network-pre.target
      Wants=network-pre.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=-/usr/local/sbin/rasputin ap-mac

      [Install]
      WantedBy=multi-user.target
  notify: reload systemd

- name: Enable the AP BSSID randomiser
  ansible.builtin.systemd:
    name: rasputin-ap-mac.service
    enabled: "{{ randomize_ap_mac | default(true) | bool }}"
    daemon_reload: true

# --- config ----------------------------------------------------------------
- name: Create rasputin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /usr/local/share/rasputin
    - /etc/rasputin

# default_mode is only a SEED (written once, force:false). The authoritative
# mode lives in /etc/rasputin/mode and diverges the moment you run `rasputin
# uplink`. Gating config on the seed meant a routine deploy at a hotel could
# install a DHCP server on the VENUE's ethernet - a rogue DHCP server on
# someone else's LAN, permanent when converge_on_deploy=false.
- name: Read the declared mode
  ansible.builtin.slurp:
    src: /etc/rasputin/mode
  register: _mode_file
  failed_when: false
  changed_when: false

- name: Read the declared profile
  ansible.builtin.set_fact:
    _declared: "{{ (_mode_file.content | b64decode | trim) if (_mode_file.content is defined) else default_mode }}"

# /etc/rasputin/mode holds a PROFILE name now, not a raw mode. Comparing it
# directly against 'serve' meant the profile 'home' - which IS serve - looked
# like an uplink, and the eth0 DHCP config was deleted out from under a
# downstream network that depends on it. Resolve through the same profile map
# rasputin uses, so the two can never disagree.
- name: Resolve the profile to a mode
  ansible.builtin.set_fact:
    effective_mode: "{{ rasputin_profiles[_declared].mode if (_declared in rasputin_profiles) else _declared }}"

- name: Show which mode config is being applied for
  ansible.builtin.debug:
    msg: "declared profile = {{ _declared }} -> effective mode = {{ effective_mode }}"

- name: Base dnsmasq policy
  ansible.builtin.template:
    src: 10-base.conf.j2
    dest: /etc/dnsmasq.d/10-base.conf
    mode: "0644"
  notify: restart dnsmasq

- name: AP dnsmasq config (constant)
  ansible.builtin.template:
    src: 20-wlan1-ap.conf.j2
    dest: /etc/dnsmasq.d/20-wlan1-ap.conf
    mode: "0644"
  notify: restart dnsmasq

# Staged, not installed: rasputin installs/removes it per mode.
- name: Stage the eth0-LAN snippet
  ansible.builtin.template:
    src: 30-eth0-lan.conf.j2
    dest: /usr/local/share/rasputin/30-eth0-lan.conf
    mode: "0644"
  notify: converge rasputin

# Skipped unless ap_passphrase is vaulted. Without this guard the run aborts on
# an undefined variable - or worse, renders an empty passphrase and drops every
# client currently associated to the AP.
# Without this, a deploy with converge_on_deploy=false deletes RaspAP's
# 090_eth0.conf and installs nothing in its place, because only `rasputin
# converge` installs the snippet. dnsmasq would then restart with no DHCP on
# eth0 and every downstream WAN would lose its lease. rasputin still owns this
# file afterwards - it removes it when switching to uplink mode.
- name: Install the eth0-LAN snippet when serving
  ansible.builtin.template:
    src: 30-eth0-lan.conf.j2
    dest: /etc/dnsmasq.d/30-eth0-lan.conf
    mode: "0644"
  when: effective_mode == 'serve'
  notify: restart dnsmasq

# Symmetric half: if we are an uplink, the LAN snippet must be ABSENT, not
# merely skipped, or a leftover from a previous serve deploy keeps serving DHCP.
- name: Remove the eth0-LAN snippet when eth0 is an uplink
  ansible.builtin.file:
    path: /etc/dnsmasq.d/30-eth0-lan.conf
    state: absent
  when: effective_mode != 'serve'
  notify: restart dnsmasq

- name: hostapd config
  ansible.builtin.template:
    src: hostapd.conf.j2
    dest: /etc/hostapd/hostapd.conf
    mode: "0600"
  when: ap_passphrase is defined and ap_passphrase | length > 0
  notify: hostapd changed

- name: Warn if hostapd is unmanaged
  ansible.builtin.debug:
    msg: "ap_passphrase undefined - leaving /etc/hostapd/hostapd.conf alone. Vault it to manage the AP."
  when: ap_passphrase is not defined or ap_passphrase | length == 0

# wlan0 presents a fresh MAC to each SSID, and a random one while merely
# scanning - otherwise the real MAC is broadcast before you ever associate.
#
# The regexp is load-bearing. Without it lineinfile matches the whole literal,
# so when rasputin has set mac_addr=0 to hold a captive-portal pin this APPENDS
# a second mac_addr= line instead of replacing it, and the file carries both.
# rasputin re-asserts the pin on the converge at the end of a deploy, so a run
# during a pinned session heals itself.
# rasputin owns these two keys at runtime: a profile with randomize_mac false
# sets them to 0 at every converge. Ansible asserting 1 here as well meant the
# two took turns - the deploy wrote 1, the converge at the end of the same deploy
# wrote 0, and the supplicant restarted to arrive back where it started. So this
# seeds a box that has never converged, and after that stays out of the way.
#
# The absent branch is unconditional because it is not a seed: with
# randomize_client_mac false the whole MAC block is compiled out of rasputin,
# nothing writes these keys, and the supplicant's own default is not to
# randomise. Removing them is then the complete statement.
# update_config=1 lets wpa_supplicant rewrite this file, and its canonical
# output carries no comments - so it silently ate the fences `rasputin join`
# writes around each network it owns, and `rasputin forget` could then no
# longer prove ownership of a block it had written minutes earlier. Observed on
# this box, not theorised: the supplicant rewrote the file and added its own
# scan_ssid=1 after an association was rejected.
#
# Nothing here needs the supplicant to persist anything - rasputin writes this
# file and `wpa_cli reconfigure` only reads it - so the write permission buys
# nothing and costs the ownership marks. forget also matches on the ssid field
# now, because a box deployed before this still has unfenced blocks on it.
- name: Stop the supplicant rewriting its own config
  ansible.builtin.lineinfile:
    path: /etc/wpa_supplicant/wpa_supplicant.conf
    regexp: '^update_config='
    line: update_config=0
    mode: "0600"
  notify: restart wpa_supplicant

- name: Check whether the supplicant already declares a randomisation setting
  ansible.builtin.command: grep -c '^mac_addr=' /etc/wpa_supplicant/wpa_supplicant.conf
  register: _wpa_mac_addr
  changed_when: false
  failed_when: false

- name: Seed wifi client MAC randomisation
  ansible.builtin.lineinfile:
    path: /etc/wpa_supplicant/wpa_supplicant.conf
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    insertbefore: BOF
    state: "{{ 'present' if (randomize_client_mac | default(true) | bool) else 'absent' }}"
  loop:
    - { key: mac_addr, value: 1 }
    - { key: preassoc_mac_addr, value: 1 }
  when: _wpa_mac_addr.stdout | int == 0
        or not (randomize_client_mac | default(true) | bool)
  notify: restart wpa_supplicant

# Stop announcing ourselves to every venue's DHCP server. `hostname` sends
# the literal string "raspberrypi" to every network we join.
# rasputin's fence is supposed to be the only author of interface config, and
# it is not: the SD card image's own stanzas sit above it, and so does a fence
# from before the netmode rename. Three `interface eth0` blocks were live on
# this box, and write_dhcpcd_block only ever rewrites its own - so declaring
# uplink mode left eth0 pinned static by the other two and dhcpcd never asked
# for a lease. hotel-eth could not take a venue address at all.
#
# Safe to delete outright rather than merge: every interface the legacy stanzas
# declare, the fence declares too. The one line not carried over is wlan1's
# `static domain_name_servers=1.1.1.1 8.8.8.8`, which is the point - this box
# resolves through blocky, not past it.
- name: Drop the pre-rename dhcpcd fence
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '(?s)^# >>> netmode managed >>>.*?^# <<< netmode managed <<<\n'
    replace: ''
    backup: true

- name: Leave rasputin the only author of dhcpcd interface config
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '^# RaspAP (wlan0|eth0|wlan1) configuration\n(interface \w+\n([a-z].*\n)*)?\n?'
    replace: ''
    backup: true

- name: Do not leak hostname to venue DHCP servers
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '^hostname$'
    replace: '#hostname   # rasputin: do not announce ourselves to venues'

# `clientid` is CORRECT here and must stay. Per dhcpcd.conf(5) a bare
# `clientid` derives the identifier from the hardware address, so it follows
# MAC randomisation. The stable-identifier trap is `duid` (DUID-LLT/UUID),
# which survives MAC changes and would defeat randomisation entirely.
# There is no `noclientid` option - dhcpcd rejects it as "unknown option".
- name: Keep the DHCP client identifier tied to the (randomised) MAC
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '^noclientid.*$'
    replace: 'clientid'

- name: Ensure no stable DUID overrides the MAC-derived clientid
  ansible.builtin.replace:
    path: /etc/dhcpcd.conf
    regexp: '^duid$'
    replace: '#duid  # rasputin: stable across MAC changes, defeats randomisation'

# The uplink renumbering is a routine event on a travel router - a hotspot that
# comes back on a new subnet, a venue lease from a different range - and until
# this hook existed nothing told the firewall. converge runs at boot and when
# you name a profile, and a hotspot coming back on a different subnet is
# neither.
- name: Re-apply the firewall when the uplink takes a new address
  ansible.builtin.copy:
    dest: /etc/dhcpcd.exit-hook
    mode: "0755"
    content: |
      # Managed by Ansible. Edit the role, not this file.
      #
      # dhcpcd sources this for every event on every interface, so it stays
      # cheap and defers the "is this the uplink?" question to rasputin, which
      # is the only thing that knows which leg that is in the current mode.
      case "$reason" in
        BOUND|REBIND|REBOOT|RENEW) ;;
        *) return 0 ;;
      esac
      [ -n "$new_ip_address" ] || return 0
      [ "$new_ip_address" = "$old_ip_address" ] && return 0
      # Detached, because dhcpcd blocks on its hooks and it is still holding the
      # lease the new ruleset is about to be built from. Being a unit also means
      # the refresh reports its own success or failure into the journal.
      systemd-run --quiet --collect \
        --unit="rasputin-refresh-$interface" \
        --description="re-apply the firewall for $interface's new address" \
        /usr/local/sbin/rasputin refresh --if "$interface" || true

# --- DoH certificate ---------------------------------------------------------
# Must come before rasputin is templated: rasputin generates blocky's listen
# file, and whether that file has an https stanza depends on these two facts.

- name: Look for the DoH certificate on the controller
  ansible.builtin.stat:
    path: "{{ blocky_doh_local_dir | expanduser }}/{{ item }}"
  register: _doh_local
  loop: [rasputin-fullchain.crt, rasputin.key]
  delegate_to: localhost
  become: false
  changed_when: false

# Both or neither. Turning the listener on with only half the material means
# blocky fails to start, and there is no second resolver on this box.
- name: Enable the DoH listener only when both cert and key exist
  ansible.builtin.set_fact:
    blocky_doh_cert: "{{ blocky_doh_dir }}/rasputin-fullchain.crt"
    blocky_doh_key: "{{ blocky_doh_dir }}/rasputin.key"
  when: _doh_local.results | map(attribute='stat.exists') | select | list | length == 2

- name: Report that DoH is staying off
  ansible.builtin.debug:
    msg: "No cert at {{ blocky_doh_local_dir }} - DoH listener stays off, plain DNS only."
  when: blocky_doh_cert is not defined

# Baseline for a deploy that does not converge; rasputin rewrites this per mode.
# See write_avahi_deny() for why: these are packets we send, so no inbound
# firewall rule can stop them reaching the venue.
- name: Stop avahi announcing this box to the venue
  community.general.ini_file:
    path: /etc/avahi/avahi-daemon.conf
    section: server
    option: deny-interfaces
    value: "{{ wan_wifi_if if effective_mode == 'serve' else wan_wifi_if ~ ',' ~ eth_if }}"
    mode: "0644"
    no_extra_spaces: true
  register: _avahi
  failed_when: false

- name: Restart avahi
  ansible.builtin.systemd:
    name: avahi-daemon
    state: restarted
  when: _avahi.changed | default(false)
  failed_when: false

- name: Install rasputin
  ansible.builtin.template:
    src: rasputin.j2
    dest: /usr/local/sbin/rasputin
    mode: "0755"
  notify: converge rasputin

- name: Converge-on-boot unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/rasputin-converge.service
    mode: "0644"
    content: |
      [Unit]
      Description=Converge declared network mode
      # After wpa_supplicant@wlan0: converge randomises the wlan0 MAC and then
      # waits for reassociation - racing a cold-starting supplicant burned the
      # whole reassociate window at boot and skipped the venue-lateral rules.
      After=network-pre.target dhcpcd.service wpa_supplicant@wlan0.service
      Wants=network-pre.target wpa_supplicant@wlan0.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/rasputin converge
      [Install]
      WantedBy=multi-user.target
  notify: reload systemd

- name: Seed the declared mode if unset
  ansible.builtin.copy:
    dest: /etc/rasputin/mode
    content: "{{ default_mode }}\n"
    mode: "0644"
    force: false

- name: Enable services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    masked: false      # hostapd ships masked on Debian/RPi OS; enable errors on it
  loop: [dnsmasq, hostapd, dhcpcd, rasputin-converge]

# --- resolver ---------------------------------------------------------------
# Ordering here is the whole cutover. The binary is fetched while dnsmasq is
# still answering DNS, because get_url runs ON the Pi and needs to resolve
# github.com; only then is dnsmasq demoted and blocky given the port.

- name: Create the blocky system user
  ansible.builtin.user:
    name: "{{ blocky_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/blocky
    create_home: false

- name: Create the DoH certificate directory
  ansible.builtin.file:
    path: "{{ blocky_doh_dir }}"
    state: directory
    owner: "{{ blocky_user }}"
    group: "{{ blocky_user }}"
    mode: "0750"
  when: blocky_doh_cert is defined

- name: Install the DoH chain
  ansible.builtin.copy:
    src: "{{ blocky_doh_local_dir | expanduser }}/rasputin-fullchain.crt"
    dest: "{{ blocky_doh_cert }}"
    owner: "{{ blocky_user }}"
    group: "{{ blocky_user }}"
    mode: "0444"
  when: blocky_doh_cert is defined
  notify: restart blocky

# The leaf key is the only private key that goes anywhere near this box. The
# root and intermediate keys stay on the controller.
- name: Install the DoH key
  ansible.builtin.copy:
    src: "{{ blocky_doh_local_dir | expanduser }}/rasputin.key"
    dest: "{{ blocky_doh_key }}"
    owner: "{{ blocky_user }}"
    group: "{{ blocky_user }}"
    mode: "0400"
  when: blocky_doh_key is defined
  no_log: true
  notify: restart blocky

- name: Create blocky config directory
  ansible.builtin.file:
    path: /etc/blocky/config.d
    state: directory
    mode: "0755"

- name: Check the installed blocky version
  ansible.builtin.command: /usr/local/bin/blocky version
  register: _blocky_installed
  changed_when: false
  failed_when: false

# Pinned by checksum, not just by tag: a release tag can be moved, and this
# binary is the box's only resolver.
- name: Download blocky
  ansible.builtin.get_url:
    url: "https://github.com/0xERR0R/blocky/releases/download/{{ blocky_version }}/blocky_{{ blocky_version }}_Linux_arm64.tar.gz"
    dest: /tmp/blocky.tar.gz
    checksum: "sha256:{{ blocky_sha256 }}"
    mode: "0600"
  when: blocky_version not in (_blocky_installed.stdout | default(''))

- name: Install blocky
  ansible.builtin.unarchive:
    src: /tmp/blocky.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include: [blocky]
    owner: root
    group: root
    mode: "0755"
  when: blocky_version not in (_blocky_installed.stdout | default(''))
  notify: restart blocky

- name: Remove the blocky tarball
  ansible.builtin.file:
    path: /tmp/blocky.tar.gz
    state: absent

- name: Base resolver policy
  ansible.builtin.template:
    src: blocky-10-base.yml.j2
    dest: /etc/blocky/config.d/10-base.yml
    mode: "0644"
  notify: restart blocky

# rasputin rewrites this on every converge - the DoH endpoints normally, the
# venue's own resolver in plaintext while a captive portal is being cleared.
# Written here as well so a deploy with converge_on_deploy=false still leaves
# blocky an upstream at all; a blocky with none fails to start, and this box
# has no second resolver.
- name: Resolver upstreams
  ansible.builtin.template:
    src: blocky-15-upstream.yml.j2
    dest: /etc/blocky/config.d/15-upstream.yml
    mode: "0644"
  notify: restart blocky

# rasputin rewrites this on every converge. Written here as well so a deploy
# with converge_on_deploy=false still leaves a resolver that can bind - the
# same reason the eth0-LAN snippet is installed rather than merely staged.
- name: Resolver listen addresses for the current mode
  ansible.builtin.template:
    src: blocky-20-listen.yml.j2
    dest: /etc/blocky/config.d/20-listen.yml
    mode: "0644"
  vars:
    blocky_listen_addrs: "{{ ['127.0.0.1:53', ap_subnet ~ '.1:53'] + ([eth_subnet ~ '.1:53'] if effective_mode == 'serve' else []) }}"
    blocky_listen_https: "{{ [ap_subnet ~ '.1:' ~ blocky_doh_port] + ([eth_subnet ~ '.1:' ~ blocky_doh_port] if effective_mode == 'serve' else []) }}"
  notify: restart blocky

- name: blocky unit
  ansible.builtin.template:
    src: blocky.service.j2
    dest: /etc/systemd/system/blocky.service
    mode: "0644"
  notify:
    - reload systemd
    - restart blocky

# wg-quick applies "DNS =" from wg0.conf by rewriting /etc/resolv.conf, which
# would send the box's OWN lookups to Proton's resolver and straight past
# blocky - no blocklist, no DoH. The tunnel does not need it: clients are told
# their resolver by DHCP, and this box is told by resolv.conf below.
# no_log because `replace` emits the whole before/after file under --diff, and
# this one carries the private key.
- name: Stop wg-quick hijacking the box's resolver
  ansible.builtin.replace:
    path: "/etc/wireguard/{{ vpn_interface }}.conf"
    regexp: '^DNS\s*=.*$'
    replace: '# DNS = removed by rasputin: this box resolves via blocky on 127.0.0.1'
  failed_when: false
  no_log: true

- name: Point the box at its own resolver
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    mode: "0644"
    content: |
      # Managed by rasputin. This box resolves through blocky like any client,
      # so its own lookups are filtered and leave over DoH.
      nameserver 127.0.0.1
      options timeout:2 attempts:2

# THE CUTOVER. Everything above is inert until dnsmasq lets go of :53.
- name: Apply the pending dnsmasq and blocky changes now
  ansible.builtin.meta: flush_handlers

# dnsmasq uses bind-dynamic, so it holds the specific LAN addresses rather
# than a wildcard - but they are the exact addresses blocky needs, so it still
# has to be gone before blocky starts.
- name: Confirm nothing still holds port 53
  ansible.builtin.shell: |
    set -o pipefail
    ss -lnup 'sport = :53'; ss -lntp 'sport = :53'
  args: {executable: /bin/bash}
  register: _port53
  changed_when: false
  failed_when: "'blocky' not in _port53.stdout and _port53.stdout is search(':53')"

- name: Enable and start blocky
  ansible.builtin.systemd:
    name: blocky
    enabled: true
    state: started
    daemon_reload: true

# Proves the resolver actually resolves, rather than merely that systemd
# thinks the unit is running.
- name: Verify the resolver answers
  ansible.builtin.command: /usr/local/bin/blocky healthcheck
  register: _blocky_health
  until: _blocky_health.rc == 0
  retries: 10
  delay: 3
  changed_when: false
