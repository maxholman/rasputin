---
# Validate BEFORE restarting. This is the step whose absence took the
# network down: an invalid fragment was written, dnsmasq died, and the only
# recovery path offered was `reload` - which cannot revive a failed unit.
- name: restart dnsmasq
  ansible.builtin.shell: dnsmasq --test && systemctl restart dnsmasq
  changed_when: true

# hostapd has no offline config-test mode, so this restarts and then confirms
# it actually came up rather than assuming success.
# Both listen on the same topic: handlers fire individually otherwise, so the
# verify step never ran and a hostapd that failed to start reported green.
- name: restart hostapd
  listen: hostapd changed
  ansible.builtin.systemd:
    name: hostapd
    state: restarted

- name: verify hostapd came up
  listen: hostapd changed
  ansible.builtin.command: systemctl is-active hostapd
  register: _hostapd
  failed_when: _hostapd.stdout.strip() != 'active'
  changed_when: false

- name: reload systemd
  ansible.builtin.systemd: daemon_reload=true

# On a first deploy leave this OFF (-e converge_on_deploy=false) and run
# `rasputin serve --rollback 300` by hand, so an untested firewall cannot
# strand you. Converging from a handler gives you no rollback window.
- name: converge rasputin
  ansible.builtin.command: /usr/local/sbin/rasputin converge
  when: converge_on_deploy | default(true) | bool
  changed_when: true

# Reassociates with the new MAC. Brief loss of the uplink; LAN admin is
# unaffected because it does not traverse wlan0.
- name: restart wpa_supplicant
  ansible.builtin.systemd:
    name: wpa_supplicant
    state: restarted

# blocky DOES have an offline config test, so it gets guard rail #1 rather than
# the hostapd treatment: validate first, and never restart onto a config that
# cannot load. Verified to exit 1 on both a bad duration and an unknown key.
# Handlers on one topic run in definition order, so this must stay above the
# restart.
- name: validate blocky config
  listen: restart blocky
  ansible.builtin.command: /usr/local/bin/blocky validate --config /etc/blocky/config.d
  changed_when: false

# Restart, then prove it resolves - the same shape as the hostapd pair above,
# and for the same reason: a resolver that failed to start must not report green.
- name: restart blocky
  listen: restart blocky
  ansible.builtin.systemd:
    name: blocky
    state: restarted
    daemon_reload: true

- name: verify blocky resolves
  listen: restart blocky
  ansible.builtin.command: /usr/local/bin/blocky healthcheck
  register: _blocky_hc
  until: _blocky_hc.rc == 0
  retries: 10
  delay: 3
  changed_when: false

# Validate the WHOLE config, not just the fragment the task already checked: a
# drop-in can parse alone and still contradict sshd_config. Guard rail #1, the
# same shape as dnsmasq.
#
# reload, not restart: established sessions survive it, so a mistake here still
# leaves you the window in which to fix it.
- name: reload ssh
  ansible.builtin.shell: sshd -t && systemctl reload ssh
  changed_when: true

# Reload, not restart: a restart re-runs device activation, which is the exact
# behaviour the unmanaged drop-in exists to stop.
- name: reload NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded

# The restart alone leaves journald reading the new config and still writing to
# /run: it opens the persistent journal at the flush, and the flush is a boot
# step that has already happened. `journalctl --flush` is what asks for it
# again, and it migrates the runtime entries across rather than stranding them,
# so enabling persistence does not cost the boot it was enabled on.
- name: restart journald
  ansible.builtin.shell: systemctl restart systemd-journald && journalctl --flush
  changed_when: true
